<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="Ciclo de transmissão da malária em cinco etapas">
  <defs>
    <marker id="cm-seta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#13858a"/>
    </marker>
    <radialGradient id="cm-centro" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5f3f2"/>
    </radialGradient>
    <filter id="cm-sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b4f5c" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- trilho circular -->
  <circle cx="380" cy="300" r="200" fill="none" stroke="#b9dfdc" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <!-- setas do ciclo (sentido horário) -->
  <g fill="none" stroke="#13858a" stroke-width="3.5" marker-end="url(#cm-seta)">
    <path d="M474 123 A 200 200 0 0 1 544 185"/>
    <path d="M578 328 A 200 200 0 0 1 533 429"/>
    <path d="M415 497 A 200 200 0 0 1 345 497"/>
    <path d="M216 415 A 200 200 0 0 1 183 335"/>
    <path d="M251 147 A 200 200 0 0 1 292 120"/>
  </g>

  <!-- centro -->
  <circle cx="380" cy="300" r="112" fill="url(#cm-centro)" stroke="#13858a" stroke-width="2.5"/>
  <g transform="translate(318 214) scale(0.32)"><rect x="70" y="250" width="260" height="8" rx="4" fill="#c9b08a"/>
  <g stroke="#6e5f4a" stroke-width="3.9" fill="none" stroke-linecap="round"><polyline points="183.4,191.8 167.0,220.9 154.3,250.0" /><polyline points="183.4,191.8 195.1,220.9 204.2,250.0" /><polyline points="183.4,191.8 223.2,220.9 254.1,250.0" /></g><g transform="translate(110 250) rotate(-40) scale(1.3)"><g><path d="M78 -4 C 110 -28, 160 -30, 190 -16 C 160 -6, 116 -2, 80 0 Z" fill="#e3f0f4" fill-opacity="0.8" stroke="#9fb0b5" stroke-width="1.5"/><g fill="#5e5244"><circle cx="110" cy="-16" r="3"/><circle cx="136" cy="-20" r="3"/><circle cx="162" cy="-18" r="3"/></g><path d="M84 -2 C 120 -6, 170 -2, 200 8 C 196 16, 150 14, 86 8 Z" fill="#6e5f4a"/><ellipse cx="72" cy="2" rx="14" ry="11" fill="#6e5f4a"/><circle cx="52" cy="2" r="9" fill="#6e5f4a"/><path d="M44 4 L 0 4" stroke="#6e5f4a" stroke-width="3" stroke-linecap="round"/></g></g>
</g>
  <text x="380" y="342" text-anchor="middle" class="t-titulo" font-size="16" fill="#0b4f5c">Ciclo de transmissão</text>
  <text x="380" y="364" text-anchor="middle" font-size="13" fill="#566577" font-style="italic">Plasmodium sp.</text>
  <text x="380" y="384" text-anchor="middle" font-size="11.5" fill="#566577"><tspan x="380">vetor: fêmea do</tspan><tspan x="380" dy="14">Anopheles</tspan></text>

  <!-- 1 -->
  <g filter="url(#cm-sombra)"><rect x="268" y="18" width="224" height="96" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="292" cy="44" r="14" fill="#13858a"/><text x="292" y="49" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">1</text>
  <text x="314" y="49" class="t-titulo" font-size="13.5" fill="#0b4f5c">Picada no doente</text>
  <text x="284" y="74" font-size="11.5" fill="#1b2733"><tspan x="284">A fêmea do <tspan font-style="italic">Anopheles</tspan> pica uma</tspan><tspan x="284" dy="16">pessoa com malária e ingere</tspan><tspan x="284" dy="16">os <tspan font-weight="700">gametócitos</tspan> do parasita.</tspan></text>

  <!-- 2 -->
  <g filter="url(#cm-sombra)"><rect x="524" y="196" width="224" height="112" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="548" cy="222" r="14" fill="#13858a"/><text x="548" y="227" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">2</text>
  <text x="570" y="227" class="t-titulo" font-size="13.5" fill="#0b4f5c">Dentro do mosquito</text>
  <text x="540" y="252" font-size="11.5" fill="#1b2733"><tspan x="540">Reprodução sexuada; formam-se</tspan><tspan x="540" dy="16">os <tspan font-weight="700">esporozoítos</tspan>, que vão</tspan><tspan x="540" dy="16">para as glândulas salivares</tspan><tspan x="540" dy="16">(cerca de 1 a 2 semanas).</tspan></text>

  <!-- 3 -->
  <g filter="url(#cm-sombra)"><rect x="440" y="458" width="236" height="96" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="464" cy="484" r="14" fill="#13858a"/><text x="464" y="489" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">3</text>
  <text x="486" y="489" class="t-titulo" font-size="13.5" fill="#0b4f5c">Nova picada</text>
  <text x="456" y="514" font-size="11.5" fill="#1b2733"><tspan x="456">O mosquito injeta os</tspan><tspan x="456" dy="16">esporozoítos com a <tspan font-weight="700">saliva</tspan></tspan><tspan x="456" dy="16">na pele de outra pessoa.</tspan></text>

  <!-- 4 -->
  <g filter="url(#cm-sombra)"><rect x="84" y="458" width="236" height="96" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="108" cy="484" r="14" fill="#13858a"/><text x="108" y="489" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">4</text>
  <text x="130" y="489" class="t-titulo" font-size="13.5" fill="#0b4f5c">No fígado</text>
  <text x="100" y="514" font-size="11.5" fill="#1b2733"><tspan x="100">O parasita se multiplica no</tspan><tspan x="100" dy="16"><tspan font-weight="700">fígado</tspan>, sem sintomas. No</tspan><tspan x="100" dy="16"><tspan font-style="italic">P. vivax</tspan>, alguns ficam “dormindo”.</tspan></text>

  <!-- 5 -->
  <g filter="url(#cm-sombra)"><rect x="12" y="140" width="232" height="140" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="36" cy="166" r="14" fill="#13858a"/><text x="36" y="171" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">5</text>
  <text x="58" y="171" class="t-titulo" font-size="13.5" fill="#0b4f5c">No sangue</text>
  <text x="28" y="196" font-size="11.5" fill="#1b2733"><tspan x="28">Invade as <tspan font-weight="700">hemácias</tspan>,</tspan><tspan x="28" dy="16">multiplica-se e as rompe:</tspan><tspan x="28" dy="16">começam a <tspan font-weight="700">febre e os calafrios</tspan>.</tspan><tspan x="28" dy="16">Formam-se gametócitos —</tspan><tspan x="28" dy="16">e o ciclo recomeça.</tspan></text>
</svg>
