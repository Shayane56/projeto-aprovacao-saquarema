<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Esquistossomose: dermatite cercariana na fase aguda e barriga d'água na forma crônica grave">
  <defs>
    <linearGradient id="fe-pele" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f3e3d3"/><stop offset="100%" stop-color="#e8cfb8"/></linearGradient>
    <filter id="fe-sombra" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b4f5c" flood-opacity="0.14"/></filter>
  </defs>
  <rect x="8" y="8" width="300" height="344" rx="18" fill="#fff8ec" stroke="#f0c88a" stroke-width="2"/>
  <text x="158" y="40" text-anchor="middle" class="t-titulo" font-size="15" fill="#b86e00">FASE AGUDA</text>
  <text x="158" y="58" text-anchor="middle" font-size="11.5" fill="#566577">logo após o contato com a água</text>
  <!-- pernas na água -->
  <path d="M110 70 L 150 70 L 146 250 L 116 250 Z" fill="url(#fe-pele)" stroke="#c9a88a" stroke-width="2.5"/>
  <path d="M166 70 L 206 70 L 200 250 L 170 250 Z" fill="url(#fe-pele)" stroke="#c9a88a" stroke-width="2.5"/>
  <rect x="40" y="200" width="236" height="56" fill="#8fcfd8" opacity="0.75"/>
  <g fill="#e0533d" opacity="0.85"><circle cx="124" cy="150" r="3"/><circle cx="136" cy="168" r="2.6"/><circle cx="128" cy="186" r="3.2"/><circle cx="140" cy="140" r="2.4"/><circle cx="184" cy="160" r="3"/><circle cx="192" cy="178" r="2.6"/><circle cx="180" cy="196" r="3"/><circle cx="190" cy="136" r="2.4"/></g>
  <g filter="url(#fe-sombra)"><rect x="20" y="266" width="276" height="76" rx="12" fill="#fff" stroke="#b9dfdc"/></g>
  <text font-size="11.5" fill="#1b2733"><tspan x="32" y="286" font-weight="700" fill="#b8331f">Dermatite cercariana</tspan><tspan x="32" dy="15">coceira e manchas vermelhas onde as</tspan><tspan x="32" dy="15">cercárias entraram. Depois pode vir febre,</tspan><tspan x="32" dy="15">diarreia e mal-estar (forma aguda).</tspan></text>
  <rect x="320" y="8" width="432" height="344" rx="18" fill="#fdebe7" stroke="#f1b3a7" stroke-width="2"/>
  <text x="536" y="40" text-anchor="middle" class="t-titulo" font-size="15" fill="#b8331f">FASE CRÔNICA — FORMA GRAVE</text>
  <text x="536" y="58" text-anchor="middle" font-size="11.5" fill="#566577">anos depois, com muitas reinfecções</text>
  <g stroke="#c9a88a" stroke-width="2.5" fill="url(#fe-pele)">
    <circle cx="460" cy="96" r="24"/>
    <path d="M412 130 C 430 120, 490 120, 508 130 C 520 140, 522 160, 520 180 C 540 210, 548 250, 530 290 C 516 320, 404 320, 390 290 C 372 250, 380 210, 400 180 C 398 160, 400 140, 412 130 Z"/>
  </g>
  <path d="M440 150 C 430 170, 436 196, 450 210 C 468 196, 476 170, 466 152 Z" fill="#c9785a" opacity="0.7"/>
  <path d="M452 120 L 452 176" stroke="#5b4fa8" stroke-width="5" stroke-linecap="round"/>
  <g fill="#5b4fa8"><circle cx="452" cy="138" r="5"/><circle cx="452" cy="156" r="4"/></g>
  <g fill="none" stroke="#7fb8c8" stroke-width="2" opacity="0.8"><path d="M404 250 c 30 10, 80 10, 112 0"/><path d="M400 270 c 30 10, 90 10, 120 0"/></g>
  <g fill="none" stroke="#13858a" stroke-width="2"><polyline points="452,140 590,100 610,100"/><polyline points="460,200 590,180 610,180"/><polyline points="500,270 590,262 610,262"/></g>
  <g fill="#13858a"><circle cx="452" cy="140" r="4"/><circle cx="460" cy="200" r="4"/><circle cx="500" cy="270" r="4"/></g>
  <g filter="url(#fe-sombra)" fill="#fff" stroke="#b9dfdc">
    <rect x="610" y="72" width="134" height="58" rx="10"/><rect x="610" y="152" width="134" height="58" rx="10"/><rect x="610" y="232" width="134" height="62" rx="10"/>
  </g>
  <text font-size="11.5" fill="#1b2733"><tspan x="620" y="94" font-weight="700" fill="#5b4fa8">Varizes de esôfago</tspan><tspan x="620" dy="15">risco de sangramento</tspan></text>
  <text font-size="11.5" fill="#1b2733"><tspan x="620" y="174" font-weight="700" fill="#b8331f">Fígado e baço</tspan><tspan x="620" dy="15">aumentados</tspan></text>
  <text font-size="11.5" fill="#1b2733"><tspan x="620" y="254" font-weight="700" fill="#0b4f5c">“Barriga d’água”</tspan><tspan x="620" dy="15">acúmulo de líquido</tspan><tspan x="620" dy="15">(ascite)</tspan></text>
  <text x="336" y="340" font-size="11" fill="#1b2733"><tspan font-weight="700" fill="#0b4f5c">A maioria</tspan> tem a forma intestinal, leve ou sem sintomas.</text>
</svg>
