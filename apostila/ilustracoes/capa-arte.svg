    <linearGradient id="cp-morro" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3f9e7a"/><stop offset="100%" stop-color="#21705a"/></linearGradient>
    <linearGradient id="cp-lente" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/></linearGradient>
  </defs>
  <!-- sol -->
