<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="Mapa mental: Cólera">
<defs><filter id="mm2-sombra" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b4f5c" flood-opacity="0.14"/></filter>
<radialGradient id="mm2-centro" cx="40%" cy="35%" r="70%"><stop offset="0%" stop-color="#3aa6d6"/><stop offset="100%" stop-color="#0b4f5c"/></radialGradient></defs>
<path d="M380 300 C 310.0 300, 310.0 106.0, 240 106.0" fill="none" stroke="#13858a" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
<circle cx="240" cy="106.0" r="6" fill="#13858a"/>
<path d="M380 300 C 310.0 300, 310.0 300.0, 240 300.0" fill="none" stroke="#2b8fc4" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
<circle cx="240" cy="300.0" r="6" fill="#2b8fc4"/>
<path d="M380 300 C 310.0 300, 310.0 494.0, 240 494.0" fill="none" stroke="#b86e00" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
<circle cx="240" cy="494.0" r="6" fill="#b86e00"/>
<path d="M380 300 C 450.0 300, 450.0 106.0, 520 106.0" fill="none" stroke="#6b59d3" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
<circle cx="520" cy="106.0" r="6" fill="#6b59d3"/>
<path d="M380 300 C 450.0 300, 450.0 300.0, 520 300.0" fill="none" stroke="#1d7650" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
<circle cx="520" cy="300.0" r="6" fill="#1d7650"/>
<path d="M380 300 C 450.0 300, 450.0 494.0, 520 494.0" fill="none" stroke="#0b4f5c" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
<circle cx="520" cy="494.0" r="6" fill="#0b4f5c"/>
<circle cx="380" cy="300" r="88" fill="#fff" opacity="0.9"/>
<circle cx="380" cy="300" r="78" fill="url(#mm2-centro)" filter="url(#mm2-sombra)"/>
<text x="380" y="294" text-anchor="middle" class="t-titulo" font-size="21" fill="#fff">Cólera</text>
<text x="380" y="316" text-anchor="middle" font-size="11.5" fill="#d6eeee">infecção intestinal aguda</text>
<text x="380" y="332" text-anchor="middle" font-size="10.5" fill="#ffd38a">notificação compulsória</text>
<text x="380" y="346" text-anchor="middle" font-size="10.5" fill="#ffd38a">imediata</text>
<g filter="url(#mm2-sombra)"><rect x="12" y="18" width="228" height="176" rx="14" fill="#fff" stroke="#13858a" stroke-width="2"/></g>
<path d="M12 32 a14 14 0 0 1 14 -14 h200 a14 14 0 0 1 14 14 v20 h-228 z" fill="#13858a"/>
<text x="126.0" y="41" text-anchor="middle" class="t-titulo" font-size="12" fill="#fff" letter-spacing="0.6">AGENTE</text>
<circle cx="26" cy="70" r="3" fill="#13858a"/>
<text x="36" y="74" font-size="11.4" fill="#1b2733">Vibrio cholerae (bactéria)</text>
<circle cx="26" cy="93" r="3" fill="#13858a"/>
<text x="36" y="97" font-size="11.4" fill="#1b2733">Bastonete curvo “em vírgula”</text>
<circle cx="26" cy="116" r="3" fill="#13858a"/>
<text x="36" y="120" font-size="11.4" fill="#1b2733">Sorogrupos O1 e O139</text>
<circle cx="26" cy="139" r="3" fill="#13858a"/>
<text x="36" y="143" font-size="11.4" fill="#1b2733">Age pela TOXINA colérica</text>
<circle cx="26" cy="162" r="3" fill="#13858a"/>
<text x="36" y="166" font-size="11.4" fill="#1b2733">Sensível a cloro, calor e ácido</text>
<g filter="url(#mm2-sombra)"><rect x="12" y="212" width="228" height="176" rx="14" fill="#fff" stroke="#2b8fc4" stroke-width="2"/></g>
<path d="M12 226 a14 14 0 0 1 14 -14 h200 a14 14 0 0 1 14 14 v20 h-228 z" fill="#2b8fc4"/>
<text x="126.0" y="235" text-anchor="middle" class="t-titulo" font-size="12" fill="#fff" letter-spacing="0.6">TRANSMISSÃO</text>
<circle cx="26" cy="264" r="3" fill="#2b8fc4"/>
<text x="36" y="268" font-size="11.4" fill="#1b2733">Via fecal-oral</text>
<circle cx="26" cy="287" r="3" fill="#2b8fc4"/>
<text x="36" y="291" font-size="11.4" fill="#1b2733">Água e alimentos contaminados</text>
<text x="36" y="314" font-size="11.4" fill="#1b2733">por fezes ou vômitos</text>
<circle cx="26" cy="333" r="3" fill="#2b8fc4"/>
<text x="36" y="337" font-size="11.4" fill="#1b2733">Frutos do mar crus, gelo</text>
<circle cx="26" cy="356" r="3" fill="#2b8fc4"/>
<text x="36" y="360" font-size="11.4" fill="#1b2733">Reservatório: ser humano</text>
<g filter="url(#mm2-sombra)"><rect x="12" y="406" width="228" height="176" rx="14" fill="#fff" stroke="#b86e00" stroke-width="2"/></g>
<path d="M12 420 a14 14 0 0 1 14 -14 h200 a14 14 0 0 1 14 14 v20 h-228 z" fill="#b86e00"/>
<text x="126.0" y="429" text-anchor="middle" class="t-titulo" font-size="12" fill="#fff" letter-spacing="0.6">PERÍODOS</text>
<circle cx="26" cy="458" r="3" fill="#b86e00"/>
<text x="36" y="462" font-size="11.4" fill="#1b2733">Incubação: horas a 5 dias</text>
<text x="36" y="485" font-size="11.4" fill="#1b2733">(em geral 2 a 3 dias)</text>
<circle cx="26" cy="504" r="3" fill="#b86e00"/>
<text x="36" y="508" font-size="11.4" fill="#1b2733">Transmissão: enquanto</text>
<text x="36" y="531" font-size="11.4" fill="#1b2733">elimina vibriões nas fezes</text>
<circle cx="26" cy="550" r="3" fill="#b86e00"/>
<text x="36" y="554" font-size="11.4" fill="#1b2733">Muitos portadores sem sintomas</text>
<g filter="url(#mm2-sombra)"><rect x="520" y="18" width="228" height="176" rx="14" fill="#fff" stroke="#6b59d3" stroke-width="2"/></g>
<path d="M520 32 a14 14 0 0 1 14 -14 h200 a14 14 0 0 1 14 14 v20 h-228 z" fill="#6b59d3"/>
<text x="634.0" y="41" text-anchor="middle" class="t-titulo" font-size="12" fill="#fff" letter-spacing="0.6">QUADRO CLÍNICO</text>
<circle cx="534" cy="70" r="3" fill="#6b59d3"/>
<text x="544" y="74" font-size="11.4" fill="#1b2733">Diarreia aquosa abundante</text>
<circle cx="534" cy="93" r="3" fill="#6b59d3"/>
<text x="544" y="97" font-size="11.4" fill="#1b2733">Fezes em “água de arroz”</text>
<circle cx="534" cy="116" r="3" fill="#6b59d3"/>
<text x="544" y="120" font-size="11.4" fill="#1b2733">Vômitos, câimbras</text>
<circle cx="534" cy="139" r="3" fill="#6b59d3"/>
<text x="544" y="143" font-size="11.4" fill="#1b2733">Desidratação rápida</text>
<circle cx="534" cy="162" r="3" fill="#6b59d3"/>
<text x="544" y="166" font-size="11.4" fill="#1b2733">Sem febre alta, sem sangue</text>
<g filter="url(#mm2-sombra)"><rect x="520" y="212" width="228" height="176" rx="14" fill="#fff" stroke="#1d7650" stroke-width="2"/></g>
<path d="M520 226 a14 14 0 0 1 14 -14 h200 a14 14 0 0 1 14 14 v20 h-228 z" fill="#1d7650"/>
<text x="634.0" y="235" text-anchor="middle" class="t-titulo" font-size="12" fill="#fff" letter-spacing="0.6">DIAGNÓSTICO E TRATAMENTO</text>
<circle cx="534" cy="264" r="3" fill="#1d7650"/>
<text x="544" y="268" font-size="11.4" fill="#1b2733">Coprocultura (fezes/vômito)</text>
<circle cx="534" cy="287" r="3" fill="#1d7650"/>
<text x="544" y="291" font-size="11.4" fill="#1b2733">Swab retal em Cary-Blair</text>
<circle cx="534" cy="310" r="3" fill="#1d7650"/>
<text x="544" y="314" font-size="11.4" fill="#1b2733">REIDRATAÇÃO: planos A, B, C</text>
<circle cx="534" cy="333" r="3" fill="#1d7650"/>
<text x="544" y="337" font-size="11.4" fill="#1b2733">Soro de reidratação oral</text>
<circle cx="534" cy="356" r="3" fill="#1d7650"/>
<text x="544" y="360" font-size="11.4" fill="#1b2733">Antibiótico só se indicado</text>
<g filter="url(#mm2-sombra)"><rect x="520" y="406" width="228" height="176" rx="14" fill="#fff" stroke="#0b4f5c" stroke-width="2"/></g>
<path d="M520 420 a14 14 0 0 1 14 -14 h200 a14 14 0 0 1 14 14 v20 h-228 z" fill="#0b4f5c"/>
<text x="634.0" y="429" text-anchor="middle" class="t-titulo" font-size="12" fill="#fff" letter-spacing="0.6">PREVENÇÃO E CONTROLE</text>
<circle cx="534" cy="458" r="3" fill="#0b4f5c"/>
<text x="544" y="462" font-size="11.4" fill="#1b2733">Água tratada: 2 gotas/litro</text>
<circle cx="534" cy="481" r="3" fill="#0b4f5c"/>
<text x="544" y="485" font-size="11.4" fill="#1b2733">Esgoto e saneamento</text>
<circle cx="534" cy="504" r="3" fill="#0b4f5c"/>
<text x="544" y="508" font-size="11.4" fill="#1b2733">Lavar as mãos e alimentos</text>
<circle cx="534" cy="527" r="3" fill="#0b4f5c"/>
<text x="544" y="531" font-size="11.4" fill="#1b2733">Frutos do mar bem cozidos</text>
<circle cx="534" cy="550" r="3" fill="#0b4f5c"/>
<text x="544" y="554" font-size="11.4" fill="#1b2733">Caixa-d’água tampada</text>
</svg>
