  <!-- explicação da imunidade -->
  <g font-size="11.5" fill="#1b2733">
    <rect x="24" y="206" width="220" height="74" rx="12" fill="#e6f5ee"/>
    <text x="36" y="228" font-weight="700" fill="#1d7650">1ª infecção: DENV-2</text>
    <text x="36" y="246">imunidade <tspan font-weight="700">para sempre</tspan></text>
    <text x="36" y="262">contra o DENV-2</text>
    <path d="M250 243 L 278 243" stroke="#0b4f5c" stroke-width="3" marker-end="url(#st-seta)"/>
    <rect x="284" y="206" width="200" height="74" rx="12" fill="#fff3df"/>
    <text x="296" y="228" font-weight="700" fill="#b86e00">Contra os outros 3</text>
    <text x="296" y="246">proteção só por</text>
    <text x="296" y="262"><tspan font-weight="700">alguns meses</tspan></text>
    <path d="M490 243 L 518 243" stroke="#0b4f5c" stroke-width="3" marker-end="url(#st-seta)"/>
    <rect x="524" y="206" width="212" height="74" rx="12" fill="#fdebe7"/>
    <text x="536" y="228" font-weight="700" fill="#b8331f">2ª infecção, outro sorotipo</text>
    <text x="536" y="246"><tspan font-weight="700">maior risco</tspan> de formas</text>
    <text x="536" y="262">graves da doença</text>
  </g>
  <!-- painel família -->
  <rect x="524" y="28" width="212" height="164" rx="14" fill="#e5f3f2"/>
  <text x="540" y="54" class="t-titulo" font-size="13" fill="#0b4f5c">Ficha do vírus</text>
  <g font-size="11.5" fill="#1b2733">
    <text x="540" y="78">Vírus de <tspan font-weight="700">RNA</tspan></text>
    <text x="540" y="98">Gênero <tspan font-style="italic">Flavivirus</tspan></text>
    <text x="540" y="118">Família <tspan font-style="italic">Flaviviridae</tspan></text>
    <text x="540" y="142">“Primos”: febre amarela</text>
    <text x="540" y="158">e zika (mesma família)</text>
    <text x="540" y="180" font-weight="700" fill="#13858a">É uma arbovirose</text>
  </g>
