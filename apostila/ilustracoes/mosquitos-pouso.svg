<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Posição de pouso do Anopheles, inclinada, comparada à do Aedes e do Culex, paralela à superfície">
  <rect x="8" y="8" width="240" height="304" rx="16" fill="#fff" stroke="#d9e3e6" stroke-width="2"/>
  <rect x="8" y="8" width="240" height="44" rx="16" fill="#0b4f5c"/><rect x="8" y="36" width="240" height="16" fill="#0b4f5c"/>
  <text x="128" y="32" text-anchor="middle" class="t-titulo" font-size="13.5" fill="#fff">Anopheles</text>
  <text x="128" y="47" text-anchor="middle" font-size="10.5" fill="#fff">“mosquito-prego” — malária</text>
  <rect x="28" y="190" width="200" height="6" rx="3" fill="#c9b08a"/>
  <g stroke="#6e5f4a" stroke-width="3.0" fill="none" stroke-linecap="round"><polyline points="116.4,145.3 103.8,167.6 94.0,190.0" /><polyline points="116.4,145.3 125.4,167.6 132.4,190.0" /><polyline points="116.4,145.3 147.0,167.6 170.8,190.0" /></g><g transform="translate(60 190) rotate(-40) scale(1.0)"><g><path d="M78 -4 C 110 -28, 160 -30, 190 -16 C 160 -6, 116 -2, 80 0 Z" fill="#e3f0f4" fill-opacity="0.8" stroke="#9fb0b5" stroke-width="1.5"/><g fill="#5e5244"><circle cx="110" cy="-16" r="3"/><circle cx="136" cy="-20" r="3"/><circle cx="162" cy="-18" r="3"/></g><path d="M84 -2 C 120 -6, 170 -2, 200 8 C 196 16, 150 14, 86 8 Z" fill="#6e5f4a"/><ellipse cx="72" cy="2" rx="14" ry="11" fill="#6e5f4a"/><circle cx="52" cy="2" r="9" fill="#6e5f4a"/><path d="M44 4 L 0 4" stroke="#6e5f4a" stroke-width="3" stroke-linecap="round"/></g></g>
  <text font-size="11" fill="#1b2733" y="228"><tspan x="22" dy="0">Pousa <tspan font-weight="700">inclinado</tspan>, quase a 45°,</tspan><tspan x="22" dy="16">como um <tspan font-weight="700">prego</tspan> espetado</tspan><tspan x="22" dy="16">Asas com <tspan font-weight="700">manchas</tspan></tspan><tspan x="22" dy="16">Pica ao <tspan font-weight="700">entardecer e à noite</tspan></tspan><tspan x="22" dy="16">Cria em água <tspan font-weight="700">limpa</tspan> de rios</tspan></text>
  <rect x="260" y="8" width="240" height="304" rx="16" fill="#fff" stroke="#d9e3e6" stroke-width="2"/>
  <rect x="260" y="8" width="240" height="44" rx="16" fill="#1f2b36"/><rect x="260" y="36" width="240" height="16" fill="#1f2b36"/>
  <text x="380" y="32" text-anchor="middle" class="t-titulo" font-size="13.5" fill="#fff">Aedes</text>
  <text x="380" y="47" text-anchor="middle" font-size="10.5" fill="#fff">dengue, zika, chikungunya</text>
  <rect x="280" y="190" width="200" height="6" rx="3" fill="#c9b08a"/>
  <g transform="translate(290 120)"><g><g stroke="#1f2b36" stroke-width="3" fill="none" stroke-linecap="round"><polyline points="70,6 60,40 50,70"/><polyline points="80,6 84,40 80,72"/><polyline points="92,4 120,30 132,64"/></g><path d="M78 -4 C 110 -28, 160 -30, 190 -16 C 160 -6, 116 -2, 80 0 Z" fill="#e3f0f4" fill-opacity="0.8" stroke="#9fb0b5" stroke-width="1.5"/><path d="M84 -2 C 120 -6, 170 -2, 200 8 C 196 16, 150 14, 86 8 Z" fill="#1f2b36"/><g stroke="#fff" stroke-width="2"><path d="M110 -2 l 2 10 M130 -1 l 2 10 M150 0 l 2 10 M170 3 l 2 8"/></g><ellipse cx="72" cy="2" rx="14" ry="11" fill="#1f2b36"/><circle cx="52" cy="2" r="9" fill="#1f2b36"/><path d="M44 4 L 0 4" stroke="#1f2b36" stroke-width="3" stroke-linecap="round"/></g></g>
  <text font-size="11" fill="#1b2733" y="228"><tspan x="274" dy="0">Pousa <tspan font-weight="700">paralelo</tspan> à superfície</tspan><tspan x="274" dy="16">Escuro, com <tspan font-weight="700">listras brancas</tspan></tspan><tspan x="274" dy="16">Pica <tspan font-weight="700">de dia</tspan></tspan><tspan x="274" dy="16">Cria em água parada</tspan><tspan x="274" dy="16">em recipientes</tspan></text>
  <rect x="512" y="8" width="240" height="304" rx="16" fill="#fff" stroke="#d9e3e6" stroke-width="2"/>
  <rect x="512" y="8" width="240" height="44" rx="16" fill="#9a7a52"/><rect x="512" y="36" width="240" height="16" fill="#9a7a52"/>
  <text x="632" y="32" text-anchor="middle" class="t-titulo" font-size="13.5" fill="#fff">Culex</text>
  <text x="632" y="47" text-anchor="middle" font-size="10.5" fill="#fff">pernilongo, muriçoca</text>
  <rect x="532" y="190" width="200" height="6" rx="3" fill="#c9b08a"/>
  <g transform="translate(542 120)"><g><g stroke="#9a7a52" stroke-width="3" fill="none" stroke-linecap="round"><polyline points="70,6 60,40 50,70"/><polyline points="80,6 84,40 80,72"/><polyline points="92,4 120,30 132,64"/></g><path d="M78 -4 C 110 -28, 160 -30, 190 -16 C 160 -6, 116 -2, 80 0 Z" fill="#e3f0f4" fill-opacity="0.8" stroke="#9fb0b5" stroke-width="1.5"/><path d="M84 -2 C 120 -6, 170 -2, 200 8 C 196 16, 150 14, 86 8 Z" fill="#9a7a52"/><ellipse cx="72" cy="2" rx="14" ry="11" fill="#9a7a52"/><circle cx="52" cy="2" r="9" fill="#9a7a52"/><path d="M44 4 L 0 4" stroke="#9a7a52" stroke-width="3" stroke-linecap="round"/></g></g>
  <text font-size="11" fill="#1b2733" y="228"><tspan x="526" dy="0">Pousa <tspan font-weight="700">paralelo</tspan> à superfície</tspan><tspan x="526" dy="16">Marrom-claro, sem listras</tspan><tspan x="526" dy="16">Pica <tspan font-weight="700">à noite</tspan> (zumbido)</tspan><tspan x="526" dy="16">Cria em água <tspan font-weight="700">suja</tspan>,</tspan><tspan x="526" dy="16">com matéria orgânica</tspan></text>
</svg>