<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="Ciclo de transmissão fecal-oral da cólera em cinco etapas">
  <defs>
    <marker id="cf-seta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2b8fc4"/></marker>
    <radialGradient id="cf-centro" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e3f3fa"/></radialGradient>
    <linearGradient id="cf-gota" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9fd8ef"/><stop offset="100%" stop-color="#3f9fd0"/></linearGradient>
    <radialGradient id="cf-vib" cx="40%" cy="35%" r="75%"><stop offset="0%" stop-color="#b8f0d8"/><stop offset="100%" stop-color="#22906a"/></radialGradient>
    <filter id="cf-sombra" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b4f5c" flood-opacity="0.15"/></filter>
  </defs>
  <circle cx="380" cy="300" r="200" fill="none" stroke="#bfe3f2" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <g fill="none" stroke="#2b8fc4" stroke-width="3.5" marker-end="url(#cf-seta)">
    <path d="M474 123 A 200 200 0 0 1 544 185"/>
    <path d="M578 328 A 200 200 0 0 1 533 429"/>
    <path d="M415 497 A 200 200 0 0 1 345 497"/>
    <path d="M216 415 A 200 200 0 0 1 183 335"/>
    <path d="M251 147 A 200 200 0 0 1 292 120"/>
  </g>
  <!-- centro -->
  <circle cx="380" cy="300" r="112" fill="url(#cf-centro)" stroke="#2b8fc4" stroke-width="2.5"/>
  <path d="M380 214 C 380 214, 336 262, 336 290 A 44 44 0 0 0 424 290 C 424 262, 380 214, 380 214 Z" fill="url(#cf-gota)"/>
  <g transform="translate(360 286) scale(0.14)"><path d="M0 100 C 30 30, 120 0, 190 30" stroke="#1c7a58" stroke-width="66" stroke-linecap="round" fill="none"/><path d="M0 100 C 30 30, 120 0, 190 30" stroke="url(#cf-vib)" stroke-width="58" stroke-linecap="round" fill="none"/><path d="M214 46 C 240 70, 262 22, 292 44 C 322 66, 342 22, 372 44" stroke="#2aa77b" stroke-width="7" stroke-linecap="round" fill="none"/></g>
  <text x="380" y="356" text-anchor="middle" class="t-titulo" font-size="16" fill="#0b4f5c">Via fecal-oral</text>
  <text x="380" y="376" text-anchor="middle" font-size="11.5" fill="#566577"><tspan x="380">fezes ou vômitos → água</tspan><tspan x="380" dy="14">ou alimento → boca</tspan></text>

  <!-- 1 -->
  <g filter="url(#cf-sombra)"><rect x="268" y="18" width="224" height="96" rx="14" fill="#fff" stroke="#bfe3f2" stroke-width="2"/></g>
  <circle cx="292" cy="44" r="14" fill="#2b8fc4"/><text x="292" y="49" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">1</text>
  <text x="314" y="49" class="t-titulo" font-size="13.5" fill="#0b4f5c">Eliminação</text>
  <text x="284" y="74" font-size="11.5" fill="#1b2733"><tspan x="284">O doente — ou um <tspan font-weight="700">portador sem</tspan></tspan><tspan x="284" dy="16"><tspan font-weight="700">sintomas</tspan> — elimina vibriões</tspan><tspan x="284" dy="16">nas <tspan font-weight="700">fezes</tspan> e nos <tspan font-weight="700">vômitos</tspan>.</tspan></text>
  <!-- 2 -->
  <g filter="url(#cf-sombra)"><rect x="524" y="196" width="224" height="112" rx="14" fill="#fff" stroke="#bfe3f2" stroke-width="2"/></g>
  <circle cx="548" cy="222" r="14" fill="#2b8fc4"/><text x="548" y="227" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">2</text>
  <text x="570" y="227" class="t-titulo" font-size="13.5" fill="#0b4f5c">Sem saneamento</text>
  <text x="540" y="252" font-size="11.5" fill="#1b2733"><tspan x="540">Sem esgoto tratado, as fezes</tspan><tspan x="540" dy="16">chegam a <tspan font-weight="700">rios, poços, praias</tspan></tspan><tspan x="540" dy="16">e à rede de água, que fica</tspan><tspan x="540" dy="16">contaminada.</tspan></text>
  <!-- 3 -->
  <g filter="url(#cf-sombra)"><rect x="440" y="458" width="236" height="96" rx="14" fill="#fff" stroke="#bfe3f2" stroke-width="2"/></g>
  <circle cx="464" cy="484" r="14" fill="#2b8fc4"/><text x="464" y="489" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">3</text>
  <text x="486" y="489" class="t-titulo" font-size="13.5" fill="#0b4f5c">Água e alimentos</text>
  <text x="456" y="514" font-size="11.5" fill="#1b2733"><tspan x="456">Água sem tratamento, <tspan font-weight="700">gelo</tspan>,</tspan><tspan x="456" dy="16"><tspan font-weight="700">frutos do mar crus</tspan> e verduras</tspan><tspan x="456" dy="16">regadas com água contaminada.</tspan></text>
  <!-- 4 -->
  <g filter="url(#cf-sombra)"><rect x="84" y="458" width="236" height="96" rx="14" fill="#fff" stroke="#bfe3f2" stroke-width="2"/></g>
  <circle cx="108" cy="484" r="14" fill="#2b8fc4"/><text x="108" y="489" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">4</text>
  <text x="130" y="489" class="t-titulo" font-size="13.5" fill="#0b4f5c">Ingestão</text>
  <text x="100" y="514" font-size="11.5" fill="#1b2733"><tspan x="100">Uma pessoa saudável bebe a</tspan><tspan x="100" dy="16">água ou come o alimento com</tspan><tspan x="100" dy="16">grande quantidade de vibriões.</tspan></text>
  <!-- 5 -->
  <g filter="url(#cf-sombra)"><rect x="12" y="140" width="232" height="140" rx="14" fill="#fff" stroke="#bfe3f2" stroke-width="2"/></g>
  <circle cx="36" cy="166" r="14" fill="#2b8fc4"/><text x="36" y="171" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">5</text>
  <text x="58" y="171" class="t-titulo" font-size="13.5" fill="#0b4f5c">No intestino</text>
  <text x="28" y="196" font-size="11.5" fill="#1b2733"><tspan x="28">Os vibriões que passam pelo</tspan><tspan x="28" dy="16">ácido do estômago se fixam</tspan><tspan x="28" dy="16">no <tspan font-weight="700">intestino delgado</tspan>, liberam</tspan><tspan x="28" dy="16">a <tspan font-weight="700">toxina</tspan> e começa a diarreia</tspan><tspan x="28" dy="16">— e o ciclo recomeça.</tspan></text>
</svg>
