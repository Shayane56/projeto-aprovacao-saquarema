<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Esquema da úlcera típica da leishmaniose tegumentar e da forma mucosa no nariz">
  <defs>
    <radialGradient id="ll-pele" cx="50%" cy="45%" r="70%"><stop offset="0%" stop-color="#f6e2cf"/><stop offset="100%" stop-color="#e9c9ab"/></radialGradient>
    <radialGradient id="ll-fundo" cx="50%" cy="45%" r="60%"><stop offset="0%" stop-color="#e98a7a"/><stop offset="100%" stop-color="#c85a4a"/></radialGradient>
    <filter id="ll-sombra" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b4f5c" flood-opacity="0.14"/></filter>
  </defs>
  <!-- ===== painel 1: úlcera ===== -->
  <rect x="8" y="8" width="452" height="314" rx="18" fill="#fff" stroke="#b9dfdc" stroke-width="2"/>
  <text x="234" y="38" text-anchor="middle" class="t-titulo" font-size="15.5" fill="#0b4f5c">Forma cutânea localizada — a úlcera típica</text>
  <!-- pele -->
  <ellipse cx="170" cy="182" rx="134" ry="104" fill="url(#ll-pele)"/>
  <!-- borda elevada (moldura) -->
  <ellipse cx="170" cy="182" rx="76" ry="60" fill="#d99a7e" stroke="#b9775c" stroke-width="3"/>
  <ellipse cx="170" cy="180" rx="66" ry="51" fill="#e7b296"/>
  <!-- fundo granuloso -->
  <ellipse cx="170" cy="184" rx="54" ry="40" fill="url(#ll-fundo)"/>
  <g fill="#f1a597" opacity="0.95">
    <circle cx="146" cy="172" r="4"/><circle cx="160" cy="166" r="3.5"/><circle cx="176" cy="170" r="4"/><circle cx="194" cy="176" r="3.5"/>
    <circle cx="150" cy="190" r="3.5"/><circle cx="168" cy="186" r="4.2"/><circle cx="186" cy="194" r="4"/><circle cx="204" cy="190" r="3"/>
    <circle cx="158" cy="206" r="3.5"/><circle cx="176" cy="208" r="3.5"/><circle cx="194" cy="208" r="3"/><circle cx="138" cy="200" r="3"/>
  </g>
  <!-- chamadas -->
  <g fill="none" stroke="#13858a" stroke-width="2">
    <polyline points="238,160 288,112 306,112"/>
    <polyline points="186,192 288,198 306,198"/>
    <polyline points="232,218 270,272 306,272"/>
  </g>
  <g fill="#13858a"><circle cx="238" cy="160" r="4"/><circle cx="186" cy="192" r="4"/><circle cx="232" cy="218" r="4"/></g>
  <g filter="url(#ll-sombra)" fill="#fff" stroke="#b9dfdc">
    <rect x="306" y="78" width="146" height="70" rx="10"/>
    <rect x="306" y="166" width="146" height="64" rx="10"/>
    <rect x="306" y="250" width="146" height="62" rx="10"/>
  </g>
  <text font-size="11.5" fill="#1b2733"><tspan x="316" y="98" font-weight="700" fill="#0b4f5c">Bordas elevadas</tspan><tspan x="316" dy="15">“em moldura”,</tspan><tspan x="316" dy="15">bem delimitadas</tspan></text>
  <text font-size="11.5" fill="#1b2733"><tspan x="316" y="186" font-weight="700" fill="#0b4f5c">Fundo granuloso</tspan><tspan x="316" dy="15">avermelhado</tspan><tspan x="316" dy="15">(aspecto “grãos”)</tspan></text>
  <text font-size="11.5" fill="#1b2733"><tspan x="316" y="270" font-weight="700" fill="#b8331f">Geralmente indolor</tspan><tspan x="316" dy="15">arredondada, surge</tspan><tspan x="316" dy="15">no local da picada</tspan></text>
  <text x="34" y="306" font-size="11" fill="#566577" font-style="italic">Esquema didático, fora de escala.</text>

  <!-- ===== painel 2: forma mucosa ===== -->
  <rect x="472" y="8" width="280" height="314" rx="18" fill="#fff" stroke="#b9dfdc" stroke-width="2"/>
  <text x="612" y="38" text-anchor="middle" class="t-titulo" font-size="15.5" fill="#0b4f5c">Forma mucosa</text>
  <!-- perfil de rosto -->
  <path d="M560 70 C 610 62, 652 86, 664 126 C 668 140, 676 150, 690 160 C 698 166, 694 176, 684 178 C 686 186, 680 192, 674 194 C 678 204, 672 212, 662 212 C 664 236, 650 252, 626 256 L 620 300 L 540 300 C 546 270, 540 240, 524 214 C 504 180, 510 100, 560 70 Z" fill="url(#ll-pele)" stroke="#c9a88a" stroke-width="2.5"/>
  <path d="M560 70 C 520 76, 500 110, 506 150 C 514 120, 540 92, 584 86 Z" fill="#5b4636"/>
  <ellipse cx="640" cy="128" rx="5" ry="3.5" fill="#3b2a1c"/>
  <path d="M628 118 c 8 -6, 18 -6, 24 0" stroke="#5b4636" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- lesão no nariz -->
  <ellipse cx="684" cy="170" rx="12" ry="9" fill="#c85a4a" opacity="0.9"/>
  <ellipse cx="682" cy="170" rx="6" ry="4" fill="#e98a7a"/>
  <path d="M670 200 c 4 2, 8 2, 12 0" stroke="#b9775c" stroke-width="2" fill="none"/>
  <g fill="none" stroke="#13858a" stroke-width="2"><polyline points="696,172 724,206 724,224"/></g>
  <circle cx="696" cy="172" r="4" fill="#13858a"/>
  <g filter="url(#ll-sombra)"><rect x="486" y="226" width="252" height="86" rx="10" fill="#fff" stroke="#b9dfdc"/></g>
  <text font-size="11.5" fill="#1b2733"><tspan x="498" y="246" font-weight="700" fill="#0b4f5c">Lesões no nariz, boca e garganta</tspan><tspan x="498" dy="15">pode destruir o septo nasal;</tspan><tspan x="498" dy="15">aparece meses ou anos depois.</tspan><tspan x="498" dy="15" font-weight="700" fill="#b86e00">Principal: L. braziliensis</tspan></text>
</svg>
