<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Rua alagada com situações de risco de leptospirose numeradas">
  <defs>
    <linearGradient id="en-ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9fb0bb"/><stop offset="100%" stop-color="#dfe7ea"/></linearGradient>
    <linearGradient id="en-agua" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9a8a62" stop-opacity="0.92"/><stop offset="100%" stop-color="#6e5f3c"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="760" height="420" rx="18" fill="url(#en-ceu)"/>
  <g fill="#7f8f99"><ellipse cx="140" cy="50" rx="70" ry="20"/><ellipse cx="200" cy="40" rx="50" ry="18"/><ellipse cx="560" cy="44" rx="80" ry="22"/></g>
  <g stroke="#7f9fb0" stroke-width="2" opacity="0.6"><path d="M120 80 l -8 20 M160 76 l -8 20 M200 80 l -8 20 M540 80 l -8 20 M580 76 l -8 20 M620 80 l -8 20"/></g>
  <!-- casas -->
  <rect x="40" y="120" width="190" height="170" fill="#e8dcc6" stroke="#b8a888" stroke-width="2"/>
  <path d="M28 124 L 135 70 L 242 124 Z" fill="#b5523f"/>
  <rect x="80" y="160" width="44" height="40" fill="#cfe9ee" stroke="#8aa3a8" stroke-width="2"/>
  <rect x="520" y="130" width="200" height="160" fill="#e3e7d4" stroke="#a8b08a" stroke-width="2"/>
  <path d="M508 134 L 620 80 L 732 134 Z" fill="#7a8f5a"/>
  <rect x="640" y="200" width="44" height="90" fill="#7a5230"/>
  <!-- água de enchente -->
  <path d="M0 250 C 120 240, 260 258, 400 248 C 540 238, 660 256, 760 246 L 760 400 C 760 412, 752 420, 742 420 L 18 420 C 8 420, 0 412, 0 400 Z" fill="url(#en-agua)"/>
  <g fill="none" stroke="#c8bb94" stroke-width="2" opacity="0.7"><path d="M60 290 c 20 -6, 40 6, 60 0"/><path d="M300 330 c 20 -6, 40 6, 60 0"/><path d="M560 300 c 20 -6, 40 6, 60 0"/></g>
  <!-- bueiro transbordando -->
  <ellipse cx="420" cy="262" rx="30" ry="7" fill="#3a3a3a"/>
  <g stroke="#c8bb94" stroke-width="3" fill="none"><path d="M406 258 c -4 -12, 4 -18, 0 -26"/><path d="M420 256 c 4 -14, -4 -20, 0 -30"/><path d="M434 258 c -4 -12, 4 -18, 0 -26"/></g>
  <!-- rato nadando -->
  <g transform="translate(250 268) scale(0.28)"><path d="M30 80 C 10 86, -10 82, -30 70" stroke="#5e5244" stroke-width="10" fill="none"/><path d="M30 80 C 26 40, 80 20, 140 24 C 180 26, 204 40, 216 58 C 240 62, 256 72, 258 80 C 246 90, 220 92, 200 92 C 170 100, 80 104, 50 98 C 38 94, 30 88, 30 80 Z" fill="#8a7a6a"/><ellipse cx="196" cy="44" rx="9" ry="12" fill="#e8b8a8"/><circle cx="226" cy="64" r="5" fill="#1b1b1b"/></g>
  <!-- pessoa andando na água sem bota -->
  <g transform="translate(320 196)">
    <circle cx="0" cy="-16" r="11" fill="#c98a5a"/>
    <path d="M-12 -4 L 12 -4 L 14 34 L -14 34 Z" fill="#13858a"/>
    <path d="M-8 34 L -10 76 M 8 34 L 12 76" stroke="#c98a5a" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- crianças brincando -->
  <g transform="translate(150 300)">
    <circle cx="0" cy="-10" r="9" fill="#c98a5a"/><path d="M-9 0 L 9 0 L 10 20 L -10 20 Z" fill="#f0a12f"/>
    <path d="M10 4 l 16 -10" stroke="#c98a5a" stroke-width="5" stroke-linecap="round"/>
    <g fill="#e6dcc0"><circle cx="30" cy="-14" r="2.5"/><circle cx="36" cy="-6" r="2"/></g>
  </g>
  <!-- pessoa limpando com rodo, de botas -->
  <g transform="translate(600 230)">
    <circle cx="0" cy="-30" r="11" fill="#c98a5a"/>
    <path d="M-12 -18 L 12 -18 L 14 20 L -14 20 Z" fill="#6b59d3"/>
    <path d="M-8 20 L -10 50 M 8 20 L 12 50" stroke="#2b3a44" stroke-width="7" stroke-linecap="round"/>
    <g fill="#f0c020"><rect x="-17" y="40" width="14" height="16" rx="3"/><rect x="5" y="40" width="14" height="16" rx="3"/></g>
    <path d="M12 -10 L 44 40" stroke="#7a5230" stroke-width="4"/><path d="M30 42 h 30" stroke="#2b3a44" stroke-width="5"/>
    <g fill="#f0c020"><circle cx="-14" cy="-6" r="5"/><circle cx="14" cy="-8" r="5"/></g>
  </g>
  <!-- lixo -->
  <g transform="translate(470 280)"><path d="M0 20 C 0 0, 30 -6, 44 4 C 56 14, 50 30, 30 32 L 6 32 Z" fill="#2b3a44"/><rect x="50" y="10" width="16" height="22" fill="#b0bec5" transform="rotate(20 58 20)"/></g>
  <!-- números -->
  <g text-anchor="middle" fill="#fff">
    <circle cx="420" cy="220" r="13" fill="#e0533d"/><text x="420" y="225" class="t-titulo" font-size="13">1</text>
    <circle cx="268" cy="262" r="13" fill="#e0533d"/><text x="268" y="267" class="t-titulo" font-size="13">2</text>
    <circle cx="346" cy="178" r="13" fill="#e0533d"/><text x="346" y="183" class="t-titulo" font-size="13">3</text>
    <circle cx="174" cy="276" r="13" fill="#e0533d"/><text x="174" y="281" class="t-titulo" font-size="13">4</text>
    <circle cx="500" cy="270" r="13" fill="#e0533d"/><text x="500" y="275" class="t-titulo" font-size="13">5</text>
    <circle cx="640" cy="176" r="13" fill="#2a9a68"/><text x="640" y="181" class="t-titulo" font-size="13">✓</text>
  </g>
  <rect x="16" y="340" width="728" height="70" rx="12" fill="#fff" opacity="0.96"/>
  <g font-size="11.5" fill="#1b2733">
    <text x="30" y="362"><tspan font-weight="700" fill="#e0533d">1</tspan> Bueiro e esgoto transbordando</text>
    <text x="30" y="382"><tspan font-weight="700" fill="#e0533d">2</tspan> Ratos na água e nas tocas alagadas</text>
    <text x="30" y="402"><tspan font-weight="700" fill="#e0533d">3</tspan> Andar na água sem botas</text>
    <text x="300" y="362"><tspan font-weight="700" fill="#e0533d">4</tspan> Crianças brincando na enxurrada</text>
    <text x="300" y="382"><tspan font-weight="700" fill="#e0533d">5</tspan> Lixo acumulado: alimenta os ratos</text>
    <text x="550" y="362"><tspan font-weight="700" fill="#2a9a68">✓</tspan> Limpeza com <tspan font-weight="700">botas e</tspan></text>
    <text x="562" y="382"><tspan font-weight="700">luvas de borracha</tspan></text>
  </g>
  <rect x="440" y="18" width="306" height="32" rx="10" fill="#ffffff" opacity="0.92"/><text x="732" y="40" text-anchor="end" class="t-titulo" font-size="14" fill="#1b2733">Enchente: o momento de maior risco</text>
</svg>
