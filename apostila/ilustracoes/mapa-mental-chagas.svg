<text x="380" y="294" text-anchor="middle" class="t-titulo" font-size="21" fill="#fff">Chagas</text>
<text x="380" y="316" text-anchor="middle" font-size="11.5" fill="#d6eeee">doença de Chagas</text>
<text x="380" y="332" text-anchor="middle" font-size="10.5" fill="#ffd38a">fase aguda:</text>
<text x="380" y="346" text-anchor="middle" font-size="10.5" fill="#ffd38a">notificação imediata</text>
<g filter="url(#mm2-sombra)"><rect x="12" y="18" width="228" height="176" rx="14" fill="#fff" stroke="#13858a" stroke-width="2"/></g>
<path d="M12 32 a14 14 0 0 1 14 -14 h200 a14 14 0 0 1 14 14 v20 h-228 z" fill="#13858a"/>
<text x="126.0" y="41" text-anchor="middle" class="t-titulo" font-size="12" fill="#fff" letter-spacing="0.6">AGENTE</text>
<circle cx="26" cy="70" r="3" fill="#13858a"/>
<text x="36" y="74" font-size="11.4" fill="#1b2733">Trypanosoma cruzi</text>
<circle cx="26" cy="93" r="3" fill="#13858a"/>
<text x="36" y="97" font-size="11.4" fill="#1b2733">Protozoário com flagelo</text>
<circle cx="26" cy="116" r="3" fill="#13858a"/>
<text x="36" y="120" font-size="11.4" fill="#1b2733">Tripomastigota: no sangue</text>
<circle cx="26" cy="139" r="3" fill="#13858a"/>
<text x="36" y="143" font-size="11.4" fill="#1b2733">Epimastigota: no barbeiro</text>
<circle cx="26" cy="162" r="3" fill="#13858a"/>
<text x="36" y="166" font-size="11.4" fill="#1b2733">Amastigota: nas células</text>
<g filter="url(#mm2-sombra)"><rect x="12" y="212" width="228" height="176" rx="14" fill="#fff" stroke="#7a3428" stroke-width="2"/></g>
<path d="M12 226 a14 14 0 0 1 14 -14 h200 a14 14 0 0 1 14 14 v20 h-228 z" fill="#7a3428"/>
<text x="126.0" y="235" text-anchor="middle" class="t-titulo" font-size="12" fill="#fff" letter-spacing="0.6">VETOR</text>
<circle cx="26" cy="264" r="3" fill="#7a3428"/>
<text x="36" y="268" font-size="11.4" fill="#1b2733">Triatomíneo: “barbeiro”</text>
<circle cx="26" cy="287" r="3" fill="#7a3428"/>
<text x="36" y="291" font-size="11.4" fill="#1b2733">Macho, fêmea e ninfas</text>
<text x="36" y="314" font-size="11.4" fill="#1b2733">sugam sangue</text>
<circle cx="26" cy="333" r="3" fill="#7a3428"/>
<text x="36" y="337" font-size="11.4" fill="#1b2733">Pica à noite</text>
<circle cx="26" cy="356" r="3" fill="#7a3428"/>
<text x="36" y="360" font-size="11.4" fill="#1b2733">Esconde-se em frestas</text>
<g filter="url(#mm2-sombra)"><rect x="12" y="406" width="228" height="176" rx="14" fill="#fff" stroke="#2b8fc4" stroke-width="2"/></g>
<path d="M12 420 a14 14 0 0 1 14 -14 h200 a14 14 0 0 1 14 14 v20 h-228 z" fill="#2b8fc4"/>
<text x="126.0" y="429" text-anchor="middle" class="t-titulo" font-size="12" fill="#fff" letter-spacing="0.6">TRANSMISSÃO</text>
<circle cx="26" cy="458" r="3" fill="#2b8fc4"/>
<text x="36" y="462" font-size="11.4" fill="#1b2733">Vetorial: pelas FEZES</text>
<circle cx="26" cy="481" r="3" fill="#2b8fc4"/>
<text x="36" y="485" font-size="11.4" fill="#1b2733">Oral: alimentos (açaí, cana)</text>
<circle cx="26" cy="504" r="3" fill="#2b8fc4"/>
<text x="36" y="508" font-size="11.4" fill="#1b2733">Vertical: mãe → bebê</text>
<circle cx="26" cy="527" r="3" fill="#2b8fc4"/>
<text x="36" y="531" font-size="11.4" fill="#1b2733">Transfusão e transplante</text>
<circle cx="26" cy="550" r="3" fill="#2b8fc4"/>
<text x="36" y="554" font-size="11.4" fill="#1b2733">Acidente de laboratório</text>
<g filter="url(#mm2-sombra)"><rect x="520" y="18" width="228" height="176" rx="14" fill="#fff" stroke="#6b59d3" stroke-width="2"/></g>
<path d="M520 32 a14 14 0 0 1 14 -14 h200 a14 14 0 0 1 14 14 v20 h-228 z" fill="#6b59d3"/>
<text x="634.0" y="41" text-anchor="middle" class="t-titulo" font-size="12" fill="#fff" letter-spacing="0.6">FASES</text>
<circle cx="534" cy="70" r="3" fill="#6b59d3"/>
<text x="544" y="74" font-size="11.4" fill="#1b2733">Aguda: febre, Romaña</text>
<circle cx="534" cy="93" r="3" fill="#6b59d3"/>
<text x="544" y="97" font-size="11.4" fill="#1b2733">Crônica indeterminada:</text>
<text x="544" y="120" font-size="11.4" fill="#1b2733">a maioria, sem sintomas</text>
<circle cx="534" cy="139" r="3" fill="#6b59d3"/>
<text x="544" y="143" font-size="11.4" fill="#1b2733">Cardíaca: a mais grave</text>
<circle cx="534" cy="162" r="3" fill="#6b59d3"/>
<text x="544" y="166" font-size="11.4" fill="#1b2733">Digestiva: “megas”</text>
<g filter="url(#mm2-sombra)"><rect x="520" y="212" width="228" height="176" rx="14" fill="#fff" stroke="#1d7650" stroke-width="2"/></g>
<path d="M520 226 a14 14 0 0 1 14 -14 h200 a14 14 0 0 1 14 14 v20 h-228 z" fill="#1d7650"/>
<text x="634.0" y="235" text-anchor="middle" class="t-titulo" font-size="12" fill="#fff" letter-spacing="0.6">DIAGNÓSTICO E TRATAMENTO</text>
<circle cx="534" cy="264" r="3" fill="#1d7650"/>
<text x="544" y="268" font-size="11.4" fill="#1b2733">Aguda: parasita no sangue</text>
<circle cx="534" cy="287" r="3" fill="#1d7650"/>
<text x="544" y="291" font-size="11.4" fill="#1b2733">Crônica: 2 sorologias</text>
<circle cx="534" cy="310" r="3" fill="#1d7650"/>
<text x="544" y="314" font-size="11.4" fill="#1b2733">Benznidazol: 1ª escolha</text>
<circle cx="534" cy="333" r="3" fill="#1d7650"/>
<text x="544" y="337" font-size="11.4" fill="#1b2733">Nifurtimox: alternativa</text>
<circle cx="534" cy="356" r="3" fill="#1d7650"/>
<text x="544" y="360" font-size="11.4" fill="#1b2733">Gratuito no SUS</text>
<g filter="url(#mm2-sombra)"><rect x="520" y="406" width="228" height="176" rx="14" fill="#fff" stroke="#b86e00" stroke-width="2"/></g>
<path d="M520 420 a14 14 0 0 1 14 -14 h200 a14 14 0 0 1 14 14 v20 h-228 z" fill="#b86e00"/>
<text x="634.0" y="429" text-anchor="middle" class="t-titulo" font-size="12" fill="#fff" letter-spacing="0.6">PREVENÇÃO E CONTROLE</text>
<circle cx="534" cy="458" r="3" fill="#b86e00"/>
<text x="544" y="462" font-size="11.4" fill="#1b2733">Entregar barbeiro no PIT</text>
<circle cx="534" cy="481" r="3" fill="#b86e00"/>
<text x="544" y="485" font-size="11.4" fill="#1b2733">Borrifação residual</text>
<circle cx="534" cy="504" r="3" fill="#b86e00"/>
<text x="544" y="508" font-size="11.4" fill="#1b2733">Melhoria das casas</text>
<circle cx="534" cy="527" r="3" fill="#b86e00"/>
<text x="544" y="531" font-size="11.4" fill="#1b2733">Higiene dos alimentos</text>
<circle cx="534" cy="550" r="3" fill="#b86e00"/>
<text x="544" y="554" font-size="11.4" fill="#1b2733">Pré-natal e triagem</text>
</svg>
