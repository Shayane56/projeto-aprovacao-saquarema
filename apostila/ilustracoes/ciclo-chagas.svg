<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="Ciclo de transmissão vetorial da doença de Chagas em cinco etapas">
  <defs>
    <marker id="cc-seta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#13858a"/>
    </marker>
    <radialGradient id="cc-centro" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5f3f2"/>
    </radialGradient>
    <filter id="cc-sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b4f5c" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- trilho circular -->
  <circle cx="380" cy="300" r="200" fill="none" stroke="#b9dfdc" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <!-- setas do ciclo (sentido horário) -->
  <g fill="none" stroke="#13858a" stroke-width="3.5" marker-end="url(#cc-seta)">
    <path d="M474 123 A 200 200 0 0 1 544 185"/>
    <path d="M578 328 A 200 200 0 0 1 533 429"/>
    <path d="M415 497 A 200 200 0 0 1 345 497"/>
    <path d="M216 415 A 200 200 0 0 1 183 335"/>
    <path d="M251 147 A 200 200 0 0 1 292 120"/>
  </g>

  <!-- centro -->
  <circle cx="380" cy="300" r="112" fill="url(#cc-centro)" stroke="#13858a" stroke-width="2.5"/>
  <g transform="translate(316 206) scale(0.33)"><g class="barbeiro">
    <defs><clipPath id="bb-borda2"><ellipse cx="258" cy="160" rx="112" ry="64"/></clipPath></defs>
    <g stroke="#2a1c14" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="130,140 112,96 74,80"/><polyline points="130,180 112,224 74,240"/>
      <polyline points="168,134 166,78 140,52"/><polyline points="168,186 166,242 140,268"/>
      <polyline points="210,108 236,60 230,30"/><polyline points="210,212 236,260 230,290"/>
    </g>
    <ellipse cx="258" cy="160" rx="112" ry="64" fill="#e8742c"/>
    <g clip-path="url(#bb-borda2)"><rect x="176" y="90" width="10" height="140" fill="#2a1c14"/><rect x="200" y="90" width="10" height="140" fill="#2a1c14"/><rect x="224" y="90" width="10" height="140" fill="#2a1c14"/><rect x="248" y="90" width="10" height="140" fill="#2a1c14"/><rect x="272" y="90" width="10" height="140" fill="#2a1c14"/><rect x="296" y="90" width="10" height="140" fill="#2a1c14"/><rect x="320" y="90" width="10" height="140" fill="#2a1c14"/><rect x="344" y="90" width="10" height="140" fill="#2a1c14"/></g>
    <ellipse cx="258" cy="160" rx="96" ry="50" fill="#3a2618"/>
    <path d="M166 160 C 190 116, 268 104, 340 122 C 352 140, 352 180, 340 198 C 268 216, 190 204, 166 160 Z" fill="#4a3220"/>
    <path d="M190 160 L 330 128 M190 160 L 330 192" stroke="#2a1c14" stroke-width="2.5"/>
    <path d="M200 160 L 352 160" stroke="#2a1c14" stroke-width="2"/>
    <path d="M150 160 L 182 138 L 182 182 Z" fill="#2a1c14"/>
    <path d="M110 140 L 160 112 L 170 112 L 172 208 L 160 208 L 110 180 Z" fill="#3a2618" stroke="#2a1c14" stroke-width="2"/>
    <path d="M122 140 L 160 122 M122 180 L 160 198" stroke="#e8742c" stroke-width="3"/>
    <path d="M112 150 C 90 150, 60 154, 38 160 C 60 166, 90 170, 112 170 Z" fill="#3a2618" stroke="#2a1c14" stroke-width="2"/>
    <ellipse cx="94" cy="148" rx="7" ry="5" fill="#120a06"/><ellipse cx="94" cy="172" rx="7" ry="5" fill="#120a06"/>
    <g stroke="#2a1c14" stroke-width="3" fill="none" stroke-linecap="round"><path d="M66 156 C 50 140, 34 128, 14 122"/><path d="M66 164 C 50 180, 34 192, 14 198"/></g>
  </g></g>
  <text x="380" y="342" text-anchor="middle" class="t-titulo" font-size="16" fill="#0b4f5c">Ciclo de transmissão</text>
  <text x="380" y="364" text-anchor="middle" font-size="13" fill="#566577" font-style="italic">Trypanosoma cruzi</text>
  <text x="380" y="384" text-anchor="middle" font-size="11.5" fill="#566577"><tspan x="380">vetor: barbeiro</tspan><tspan x="380" dy="14">(triatomíneo)</tspan></text>

  <!-- 1 -->
  <g filter="url(#cc-sombra)"><rect x="268" y="18" width="224" height="96" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="292" cy="44" r="14" fill="#13858a"/><text x="292" y="49" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">1</text>
  <text x="314" y="49" class="t-titulo" font-size="13.5" fill="#0b4f5c">Picada no infectado</text>
  <text x="284" y="74" font-size="11.5" fill="#1b2733"><tspan x="284">O barbeiro suga o sangue de</tspan><tspan x="284" dy="16">pessoa ou animal infectado e</tspan><tspan x="284" dy="16">ingere as <tspan font-weight="700">tripomastigotas</tspan>.</tspan></text>

  <!-- 2 -->
  <g filter="url(#cc-sombra)"><rect x="524" y="196" width="224" height="112" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="548" cy="222" r="14" fill="#13858a"/><text x="548" y="227" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">2</text>
  <text x="570" y="227" class="t-titulo" font-size="13.5" fill="#0b4f5c">Dentro do barbeiro</text>
  <text x="540" y="252" font-size="11.5" fill="#1b2733"><tspan x="540">No intestino, viram <tspan font-weight="700">epimastigotas</tspan></tspan><tspan x="540" dy="16">e se multiplicam. No fim do</tspan><tspan x="540" dy="16">intestino, viram tripomastigotas</tspan><tspan x="540" dy="16"><tspan font-style="italic">metacíclicas</tspan> (infectantes).</tspan></text>

  <!-- 3 -->
  <g filter="url(#cc-sombra)"><rect x="440" y="458" width="236" height="96" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="464" cy="484" r="14" fill="#13858a"/><text x="464" y="489" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">3</text>
  <text x="486" y="489" class="t-titulo" font-size="13.5" fill="#0b4f5c">Picada e fezes</text>
  <text x="456" y="514" font-size="11.5" fill="#1b2733"><tspan x="456">Ao picar outra pessoa, o barbeiro</tspan><tspan x="456" dy="16"><tspan font-weight="700">defeca</tspan> perto da picada: o parasita</tspan><tspan x="456" dy="16">sai nas <tspan font-weight="700">fezes</tspan>, não na saliva.</tspan></text>

  <!-- 4 -->
  <g filter="url(#cc-sombra)"><rect x="84" y="458" width="236" height="96" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="108" cy="484" r="14" fill="#13858a"/><text x="108" y="489" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">4</text>
  <text x="130" y="489" class="t-titulo" font-size="13.5" fill="#0b4f5c">Entrada do parasita</text>
  <text x="100" y="514" font-size="11.5" fill="#1b2733"><tspan x="100">A pessoa <tspan font-weight="700">coça</tspan> e leva as fezes</tspan><tspan x="100" dy="16">à ferida da picada ou às</tspan><tspan x="100" dy="16"><tspan font-weight="700">mucosas</tspan> (por exemplo, o olho).</tspan></text>

  <!-- 5 -->
  <g filter="url(#cc-sombra)"><rect x="12" y="140" width="232" height="140" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="36" cy="166" r="14" fill="#13858a"/><text x="36" y="171" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">5</text>
  <text x="58" y="171" class="t-titulo" font-size="13.5" fill="#0b4f5c">Dentro do corpo</text>
  <text x="28" y="196" font-size="11.5" fill="#1b2733"><tspan x="28">O parasita entra nas células</tspan><tspan x="28" dy="16">e vira <tspan font-weight="700">amastigota</tspan>, que se</tspan><tspan x="28" dy="16">multiplica. Depois volta ao</tspan><tspan x="28" dy="16">sangue como tripomastigota</tspan><tspan x="28" dy="16">— e o ciclo recomeça.</tspan></text>
</svg>
