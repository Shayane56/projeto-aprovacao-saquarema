<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-label="Quintal com as medidas de manejo ambiental contra o flebotomíneo">
  <defs>
    <linearGradient id="qt-ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe9c7"/><stop offset="100%" stop-color="#fff8ee"/></linearGradient>
    <linearGradient id="qt-grama" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9fd18a"/><stop offset="100%" stop-color="#7cbf6a"/></linearGradient>
    <filter id="qt-sombra" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b4f5c" flood-opacity="0.16"/></filter>
  </defs>
  <!-- cenário -->
  <rect x="0" y="0" width="760" height="500" rx="18" fill="url(#qt-ceu)"/>
  <circle cx="660" cy="62" r="30" fill="#f6b955" opacity="0.85"/>
  <path d="M0 300 C 160 284, 320 296, 480 288 C 600 282, 700 290, 760 286 L 760 482 C 760 492, 752 500, 742 500 L 18 500 C 8 500, 0 492, 0 482 Z" fill="url(#qt-grama)"/>

  <!-- casa -->
  <g>
    <rect x="300" y="168" width="200" height="140" fill="#fdf6ea" stroke="#c9b08a" stroke-width="2.5"/>
    <path d="M284 172 L 400 96 L 516 172 Z" fill="#d0684f" stroke="#a84d38" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- janela com tela -->
    <rect x="322" y="200" width="62" height="52" rx="3" fill="#cfe9ee" stroke="#8aa3a8" stroke-width="2.5"/>
    <g stroke="#7b9196" stroke-width="0.9" opacity="0.9">
      <path d="M322 206 h62 M322 212 h62 M322 218 h62 M322 224 h62 M322 230 h62 M322 236 h62 M322 242 h62 M322 248 h62"/>
      <path d="M328 200 v52 M334 200 v52 M340 200 v52 M346 200 v52 M352 200 v52 M358 200 v52 M364 200 v52 M370 200 v52 M376 200 v52"/>
    </g>
    <!-- porta -->
    <rect x="420" y="214" width="50" height="94" rx="3" fill="#9a6a45" stroke="#7a4f30" stroke-width="2"/>
    <circle cx="460" cy="262" r="3" fill="#f0c25a"/>
  </g>

  <!-- árvore podada (copa alta, sol no chão) -->
  <g>
    <rect x="160" y="170" width="20" height="132" rx="6" fill="#8a5a33"/>
    <circle cx="170" cy="150" r="42" fill="#4f9d5d"/><circle cx="140" cy="168" r="24" fill="#5fae6a"/><circle cx="200" cy="168" r="24" fill="#5fae6a"/>
    <!-- raios de sol chegando ao chão -->
    <g stroke="#f6b955" stroke-width="3" stroke-linecap="round" opacity="0.9"><path d="M226 216 l 18 40"/><path d="M244 206 l 22 44"/><path d="M110 220 l -14 36"/></g>
  </g>
  <!-- tesoura de poda -->
  <g transform="translate(210 112) rotate(-20)">
    <path d="M0 0 l 26 6 M0 10 l 26 -6" stroke="#566577" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-6" cy="-2" r="5" fill="none" stroke="#e0533d" stroke-width="3"/><circle cx="-6" cy="12" r="5" fill="none" stroke="#e0533d" stroke-width="3"/>
  </g>

  <!-- rastelo e saco de folhas -->
  <g>
    <path d="M90 352 l 36 -78" stroke="#8a5a33" stroke-width="4" stroke-linecap="round"/>
    <path d="M76 350 l 30 12" stroke="#566577" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#566577" stroke-width="2.4" stroke-linecap="round"><path d="M78 352 l -2 8"/><path d="M86 355 l -2 8"/><path d="M94 358 l -2 8"/><path d="M102 361 l -2 8"/></g>
    <path d="M128 360 C 124 330, 140 318, 156 320 C 172 318, 186 330, 182 360 C 180 376, 130 376, 128 360 Z" fill="#2b3a44"/>
    <path d="M146 320 c 4 -10, 14 -10, 18 0" fill="none" stroke="#2b3a44" stroke-width="4"/>
    <path d="M140 312 c 6 -8, 14 -8, 18 -2 c -6 6, -14 6, -18 2 z" fill="#c9a03a"/>
  </g>

  <!-- galinheiro e canil afastados (lado direito) -->
  <g>
    <rect x="600" y="240" width="110" height="74" rx="4" fill="#f4e3c3" stroke="#b98f52" stroke-width="2.5"/>
    <path d="M592 244 L 655 204 L 718 244 Z" fill="#b98f52"/>
    <g stroke="#b98f52" stroke-width="1.4"><path d="M612 250 v58 M624 250 v58 M636 250 v58 M648 250 v58 M660 250 v58 M672 250 v58 M684 250 v58 M696 250 v58"/></g>
    <!-- galinha -->
    <ellipse cx="642" cy="298" rx="16" ry="11" fill="#fff" stroke="#c9b08a"/>
    <circle cx="656" cy="286" r="7" fill="#fff" stroke="#c9b08a"/>
    <path d="M662 286 l 6 2 l -6 2 z" fill="#f0a12f"/><path d="M654 278 c 2 -4, 6 -4, 6 0" fill="#e0533d"/>
  </g>
  <!-- seta de distância -->
  <g stroke="#0b4f5c" stroke-width="2" fill="#0b4f5c">
    <path d="M512 330 L 596 330" stroke-dasharray="5 4"/>
    <path d="M512 330 l 8 -5 v10 z"/><path d="M596 330 l -8 -5 v10 z"/>
  </g>
  <text x="554" y="350" text-anchor="middle" font-size="11" fill="#0b4f5c" font-weight="700">longe da casa</text>

  <!-- lixeira tampada -->
  <g>
    <rect x="530" y="384" width="44" height="54" rx="5" fill="#2a9a68"/>
    <rect x="524" y="374" width="56" height="12" rx="4" fill="#1d7650"/>
    <path d="M544 396 v32 M552 396 v32 M560 396 v32" stroke="#bfe6d2" stroke-width="2"/>
  </g>
  <!-- frutas recolhidas no cesto -->
  <g>
    <path d="M232 384 C 232 412, 300 412, 300 384 Z" fill="#c98a45" stroke="#9a6630" stroke-width="2"/>
    <circle cx="250" cy="380" r="9" fill="#e05a3d"/><circle cx="268" cy="376" r="9" fill="#f0a12f"/><circle cx="284" cy="381" r="8" fill="#9fc24a"/>
  </g>

  <!-- chamadas numeradas -->
  <g font-family="Poppins" font-weight="700" font-size="13" fill="#fff" text-anchor="middle">
    <circle cx="222" cy="98" r="13" fill="#13858a"/><text x="222" y="103" class="t-titulo">1</text>
    <circle cx="190" cy="318" r="13" fill="#13858a"/><text x="190" y="323" class="t-titulo">2</text>
    <circle cx="316" cy="380" r="13" fill="#13858a"/><text x="316" y="385" class="t-titulo">3</text>
    <circle cx="690" cy="214" r="13" fill="#13858a"/><text x="690" y="219" class="t-titulo">4</text>
    <circle cx="594" cy="388" r="13" fill="#13858a"/><text x="594" y="393" class="t-titulo">5</text>
    <circle cx="356" cy="186" r="13" fill="#13858a"/><text x="356" y="191" class="t-titulo">6</text>
  </g>

  <!-- legenda inferior -->
  <g filter="url(#qt-sombra)"><rect x="16" y="418" width="508" height="68" rx="12" fill="#fff" opacity="0.96"/></g>
  <text font-size="11.5" fill="#1b2733">
    <tspan x="30" y="440"><tspan font-weight="700" fill="#13858a">1</tspan> Podar árvores: o sol seca e aquece o solo.</tspan>
    <tspan x="30" dy="18"><tspan font-weight="700" fill="#13858a">2</tspan> Varrer e recolher folhas.</tspan>
    <tspan x="30" dy="18"><tspan font-weight="700" fill="#13858a">3</tspan> Recolher frutos caídos e fezes de animais.</tspan>
    <tspan x="290" y="440"><tspan font-weight="700" fill="#13858a">4</tspan> Galinheiro e canil afastados e limpos.</tspan>
    <tspan x="290" dy="18"><tspan font-weight="700" fill="#13858a">5</tspan> Lixo orgânico em lixeira tampada.</tspan>
    <tspan x="290" dy="18"><tspan font-weight="700" fill="#13858a">6</tspan> Telas de malha fina nas janelas.</tspan>
  </text>
  <text x="742" y="466" text-anchor="end" font-size="11.5" fill="#0b4f5c" font-weight="700">Objetivo: tirar do quintal</text>
  <text x="742" y="482" text-anchor="end" font-size="11.5" fill="#0b4f5c">sombra + umidade + matéria orgânica</text>
</svg>
