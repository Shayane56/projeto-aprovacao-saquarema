<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="Casa e quintal com os principais criadouros do Aedes aegypti numerados">
  <defs>
    <linearGradient id="cr-ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e3f3fa"/><stop offset="100%" stop-color="#f7fbfc"/></linearGradient>
    <linearGradient id="cr-agua" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bfe6f5"/><stop offset="100%" stop-color="#6fbfe0"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="760" height="470" rx="18" fill="url(#cr-ceu)"/>
  <rect x="0" y="330" width="760" height="140" fill="#cfe7c4"/>
  <path d="M0 330 h760" stroke="#9fc98f" stroke-width="3"/>
  <!-- casa -->
  <rect x="220" y="150" width="300" height="180" fill="#fdf6ea" stroke="#c9b08a" stroke-width="2.5"/>
  <path d="M200 156 L 370 70 L 540 156 Z" fill="#d0684f" stroke="#a84d38" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- calha entupida -->
  <path d="M196 158 L 544 158" stroke="#8aa3a8" stroke-width="7" stroke-linecap="round"/>
  <g fill="#7a5a2c"><circle cx="230" cy="153" r="4"/><circle cx="242" cy="152" r="3"/></g>
  <path d="M236 156 h 30" stroke="#6fbfe0" stroke-width="3"/>
  <!-- caixa d'água destampada no telhado -->
  <path d="M410 70 L 470 70 L 466 112 L 414 112 Z" fill="#5b8fa8" stroke="#3d6f86" stroke-width="2"/>
  <ellipse cx="440" cy="70" rx="30" ry="6" fill="url(#cr-agua)" stroke="#3d6f86" stroke-width="2"/>
  <rect x="470" y="52" width="34" height="8" rx="3" fill="#3d6f86" transform="rotate(25 487 56)"/>
  <!-- porta e janela -->
  <rect x="340" y="230" width="56" height="100" fill="#9a6a45"/>
  <rect x="250" y="190" width="60" height="50" fill="#cfe9ee" stroke="#8aa3a8" stroke-width="2"/>
  <!-- ralo -->
  <rect x="420" y="320" width="34" height="8" rx="2" fill="#566577"/>
  <g stroke="#cfd8dc" stroke-width="1.5"><path d="M426 320 v8 M432 320 v8 M438 320 v8 M444 320 v8"/></g>
  <!-- vaso com prato -->
  <g transform="translate(150 286)">
    <path d="M0 0 L 40 0 L 34 40 L 6 40 Z" fill="#c9734a"/>
    <ellipse cx="20" cy="42" rx="28" ry="6" fill="url(#cr-agua)" stroke="#a85c38" stroke-width="2"/>
    <path d="M20 0 C 10 -20, 0 -26, -6 -30 M20 0 C 24 -24, 34 -30, 44 -34 M20 0 C 18 -16, 20 -28, 22 -38" stroke="#4f9d5d" stroke-width="3" fill="none"/>
  </g>
  <!-- pneu -->
  <g transform="translate(70 360)">
    <ellipse cx="40" cy="30" rx="44" ry="30" fill="#2b3a44"/>
    <ellipse cx="40" cy="30" rx="22" ry="14" fill="url(#cr-agua)"/>
  </g>
  <!-- garrafas e latas -->
  <g transform="translate(200 380)">
    <path d="M0 10 h 12 v -8 h 6 v 8 h 4 v 34 h -22 z" fill="#7fb7a0" opacity="0.85" transform="rotate(80 10 30)"/>
    <rect x="34" y="20" width="18" height="24" rx="3" fill="#b0bec5"/>
    <ellipse cx="43" cy="20" rx="9" ry="3" fill="url(#cr-agua)"/>
  </g>
  <!-- bebedouro de animal -->
  <g transform="translate(560 370)">
    <ellipse cx="30" cy="20" rx="34" ry="10" fill="url(#cr-agua)" stroke="#a85c38" stroke-width="3"/>
    <path d="M-4 20 L 2 34 L 58 34 L 64 20" fill="#c9734a"/>
  </g>
  <!-- piscina -->
  <g transform="translate(600 260)">
    <rect x="0" y="0" width="130" height="56" rx="8" fill="#7cbf9e" stroke="#4f8f72" stroke-width="2.5"/>
    <path d="M10 18 c 14 -6, 28 6, 42 0 c 14 -6, 28 6, 42 0" stroke="#5aa383" stroke-width="2" fill="none"/>
  </g>
  <!-- bromélia -->
  <g transform="translate(650 200)">
    <path d="M0 50 C -6 30, -20 18, -34 12 C -14 18, -4 30, 2 44 Z M0 50 C 6 30, 20 16, 36 10 C 16 20, 6 32, 2 46 Z M0 50 C -2 28, 2 10, 6 -4 C 8 14, 6 32, 4 50 Z" fill="#3f9e6a"/>
    <ellipse cx="2" cy="40" rx="6" ry="3" fill="url(#cr-agua)"/>
  </g>
  <!-- lona / entulho -->
  <g transform="translate(300 380)">
    <path d="M0 30 C 20 0, 60 -4, 90 10 C 110 20, 120 40, 110 50 L 0 50 Z" fill="#4f7fa0"/>
    <ellipse cx="60" cy="26" rx="16" ry="5" fill="url(#cr-agua)"/>
  </g>
  <!-- números -->
  <g font-family="Poppins" font-weight="700" font-size="13" fill="#fff" text-anchor="middle">
    <circle cx="470" cy="40" r="13" fill="#e0533d"/><text x="470" y="45" class="t-titulo">1</text>
    <circle cx="214" cy="132" r="13" fill="#e0533d"/><text x="214" y="137" class="t-titulo">2</text>
    <circle cx="150" cy="356" r="13" fill="#e0533d"/><text x="150" y="361" class="t-titulo">3</text>
    <circle cx="196" cy="276" r="13" fill="#e0533d"/><text x="196" y="281" class="t-titulo">4</text>
    <circle cx="276" cy="380" r="13" fill="#e0533d"/><text x="276" y="385" class="t-titulo">5</text>
    <circle cx="634" cy="362" r="13" fill="#e0533d"/><text x="634" y="367" class="t-titulo">6</text>
    <circle cx="716" cy="248" r="13" fill="#e0533d"/><text x="716" y="253" class="t-titulo">7</text>
    <circle cx="470" cy="312" r="13" fill="#e0533d"/><text x="470" y="317" class="t-titulo">8</text>
    <circle cx="684" cy="196" r="13" fill="#e0533d"/><text x="684" y="201" class="t-titulo">9</text>
    <circle cx="414" cy="372" r="13" fill="#e0533d"/><text x="414" y="377" class="t-titulo">10</text>
  </g>
</svg>
