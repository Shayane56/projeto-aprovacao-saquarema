<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="Ciclo de transmissão da peste em cinco etapas">
  <defs>
    <marker id="cp-seta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#13858a"/>
    </marker>
    <radialGradient id="cp-centro" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5f3f2"/>
    </radialGradient>
    <filter id="cp-sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b4f5c" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- trilho circular -->
  <circle cx="380" cy="300" r="200" fill="none" stroke="#b9dfdc" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <!-- setas do ciclo (sentido horário) -->
  <g fill="none" stroke="#13858a" stroke-width="3.5" marker-end="url(#cp-seta)">
    <path d="M474 123 A 200 200 0 0 1 544 185"/>
    <path d="M578 328 A 200 200 0 0 1 533 429"/>
    <path d="M415 497 A 200 200 0 0 1 345 497"/>
    <path d="M216 415 A 200 200 0 0 1 183 335"/>
    <path d="M251 147 A 200 200 0 0 1 292 120"/>
  </g>

  <!-- centro -->
  <circle cx="380" cy="300" r="112" fill="url(#cp-centro)" stroke="#13858a" stroke-width="2.5"/>
  <g transform="translate(330 220) scale(0.26)"><g class="pulga">
    <path d="M90 150 C 70 90, 130 50, 210 56 C 290 62, 330 110, 316 160 C 304 200, 250 220, 190 214 C 130 208, 100 190, 90 150 Z" fill="#8a4a2a" stroke="#5a2e18" stroke-width="3"/>
    <g stroke="#5a2e18" stroke-width="2" fill="none" opacity="0.7"><path d="M150 64 C 140 110, 142 170, 156 210"/><path d="M190 58 C 182 110, 184 170, 194 214"/><path d="M230 60 C 226 110, 228 170, 234 212"/><path d="M270 72 C 270 120, 272 170, 270 204"/></g>
    <path d="M100 130 C 70 120, 50 120, 40 132 C 50 146, 74 150, 98 150 Z" fill="#7a3e22" stroke="#5a2e18" stroke-width="3"/>
    <circle cx="66" cy="132" r="4" fill="#1b1b1b"/>
    <path d="M44 140 L 20 176" stroke="#5a2e18" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#5a2e18" stroke-width="6" stroke-linecap="round" fill="none">
      <polyline points="140,206 120,250 96,262"/>
      <polyline points="200,212 196,262 176,280"/>
      <polyline points="268,200 320,210 352,170 380,268 410,276"/>
    </g>
    <g fill="#b06a3a" opacity="0.6"><ellipse cx="200" cy="96" rx="40" ry="14"/></g>
  </g></g>
  <text x="380" y="342" text-anchor="middle" class="t-titulo" font-size="16" fill="#0b4f5c">Ciclo de transmissão</text>
  <text x="380" y="364" text-anchor="middle" font-size="13" fill="#566577" font-style="italic">Yersinia pestis</text>
  <text x="380" y="384" text-anchor="middle" font-size="11.5" fill="#566577"><tspan x="380">vetor: pulga</tspan><tspan x="380" dy="14">do rato</tspan></text>

  <!-- 1 -->
  <g filter="url(#cp-sombra)"><rect x="268" y="18" width="224" height="96" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="292" cy="44" r="14" fill="#13858a"/><text x="292" y="49" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">1</text>
  <text x="314" y="49" class="t-titulo" font-size="13.5" fill="#0b4f5c">Roedor silvestre</text>
  <text x="284" y="74" font-size="11.5" fill="#1b2733"><tspan x="284">A bactéria circula entre</tspan><tspan x="284" dy="16"><tspan font-weight="700">roedores silvestres</tspan> e suas</tspan><tspan x="284" dy="16">pulgas, nos <tspan font-weight="700">focos naturais</tspan>.</tspan></text>

  <!-- 2 -->
  <g filter="url(#cp-sombra)"><rect x="524" y="196" width="224" height="112" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="548" cy="222" r="14" fill="#13858a"/><text x="548" y="227" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">2</text>
  <text x="570" y="227" class="t-titulo" font-size="13.5" fill="#0b4f5c">Pulga infectada</text>
  <text x="540" y="252" font-size="11.5" fill="#1b2733"><tspan x="540">A pulga suga o sangue do</tspan><tspan x="540" dy="16">roedor doente; a bactéria</tspan><tspan x="540" dy="16">se multiplica e <tspan font-weight="700">“entope”</tspan> o</tspan><tspan x="540" dy="16">intestino da pulga.</tspan></text>

  <!-- 3 -->
  <g filter="url(#cp-sombra)"><rect x="440" y="458" width="236" height="96" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="464" cy="484" r="14" fill="#13858a"/><text x="464" y="489" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">3</text>
  <text x="486" y="489" class="t-titulo" font-size="13.5" fill="#0b4f5c">Picadas repetidas</text>
  <text x="456" y="514" font-size="11.5" fill="#1b2733"><tspan x="456">Com fome, a pulga pica</tspan><tspan x="456" dy="16">várias vezes e <tspan font-weight="700">regurgita</tspan> a</tspan><tspan x="456" dy="16">bactéria na pele.</tspan></text>

  <!-- 4 -->
  <g filter="url(#cp-sombra)"><rect x="84" y="458" width="236" height="96" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="108" cy="484" r="14" fill="#13858a"/><text x="108" y="489" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">4</text>
  <text x="130" y="489" class="t-titulo" font-size="13.5" fill="#0b4f5c">Rato e pessoa</text>
  <text x="100" y="514" font-size="11.5" fill="#1b2733"><tspan x="100">Ratos levam as pulgas para perto</tspan><tspan x="100" dy="16">das casas. Se o rato morre, a pulga</tspan><tspan x="100" dy="16"><tspan font-weight="700">procura outro hospedeiro</tspan>.</tspan></text>

  <!-- 5 -->
  <g filter="url(#cp-sombra)"><rect x="12" y="140" width="232" height="140" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="36" cy="166" r="14" fill="#13858a"/><text x="36" y="171" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">5</text>
  <text x="58" y="171" class="t-titulo" font-size="13.5" fill="#0b4f5c">Doença</text>
  <text x="28" y="196" font-size="11.5" fill="#1b2733"><tspan x="28">A pessoa picada tem a forma</tspan><tspan x="28" dy="16"><tspan font-weight="700">bubônica</tspan>. Se a bactéria chega</tspan><tspan x="28" dy="16">ao pulmão (forma <tspan font-weight="700">pneumônica</tspan>),</tspan><tspan x="28" dy="16">passa de pessoa a pessoa</tspan><tspan x="28" dy="16">pela tosse.</tspan></text>
</svg>
