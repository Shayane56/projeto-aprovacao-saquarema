  <text font-size="12" fill="#1b2733"><tspan x="28" y="54" font-weight="700" fill="#b8331f">Ferida no nariz</tspan><tspan x="28" dy="16">o “nariz de palhaço”</tspan></text>
  <text font-size="12" fill="#1b2733"><tspan x="28" y="134" font-weight="700" fill="#0b4f5c">Feridas na cabeça</tspan><tspan x="28" dy="16">e nas orelhas</tspan></text>
  <text font-size="12" fill="#1b2733"><tspan x="542" y="84" font-weight="700" fill="#0b4f5c">Feridas que não cicatrizam</tspan><tspan x="542" dy="16">com pus, em qualquer parte</tspan></text>
