<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="Ciclo de transmissão da dengue em cinco etapas">
  <defs>
    <marker id="cd-seta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#13858a"/>
    </marker>
    <radialGradient id="cd-centro" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5f3f2"/>
    </radialGradient>
    <filter id="cd-sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b4f5c" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- trilho circular -->
  <circle cx="380" cy="300" r="200" fill="none" stroke="#b9dfdc" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <!-- setas do ciclo (sentido horário) -->
  <g fill="none" stroke="#13858a" stroke-width="3.5" marker-end="url(#cd-seta)">
    <path d="M474 123 A 200 200 0 0 1 544 185"/>
    <path d="M578 328 A 200 200 0 0 1 533 429"/>
    <path d="M415 497 A 200 200 0 0 1 345 497"/>
    <path d="M216 415 A 200 200 0 0 1 183 335"/>
    <path d="M251 147 A 200 200 0 0 1 292 120"/>
  </g>

  <!-- centro -->
  <circle cx="380" cy="300" r="112" fill="url(#cd-centro)" stroke="#13858a" stroke-width="2.5"/>
  <g transform="translate(318 206) scale(0.34)"><g class="mosquito">
    <path d="M180 126 C 232 96, 304 100, 346 124 C 306 134, 234 138, 182 136 Z" fill="#e3f0f4" fill-opacity="0.75" stroke="#9fb0b5" stroke-width="2"/>
    <path d="M186 132 C 236 118, 296 120, 336 130" fill="none" stroke="#b9c8cc" stroke-width="1.2"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="150,166 118,210 90,266" stroke="#1b2733" stroke-width="5"/>
      <polyline points="166,170 172,222 162,282" stroke="#1b2733" stroke-width="5"/>
      <polyline points="184,164 238,196 290,168 336,146" stroke="#1b2733" stroke-width="5"/>
      <polyline points="150,166 118,210 90,266" stroke="#ffffff" stroke-width="5" stroke-dasharray="5 9"/>
      <polyline points="166,170 172,222 162,282" stroke="#ffffff" stroke-width="5" stroke-dasharray="5 9"/>
      <polyline points="184,164 238,196 290,168 336,146" stroke="#ffffff" stroke-width="5" stroke-dasharray="5 9"/>
    </g>
    <path d="M192 138 C 240 136, 300 156, 338 184 C 344 190, 338 198, 328 196 C 290 190, 232 176, 194 168 Z" fill="#1f2b36" stroke="#0d151c" stroke-width="2"/>
    <g stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"><path d="M214 167 l 3 -6"/><path d="M238 172 l 3 -7"/><path d="M262 178 l 3 -7"/><path d="M286 184 l 3 -7"/><path d="M308 189 l 2 -6"/></g>
    <ellipse cx="166" cy="146" rx="32" ry="27" fill="#22303c" stroke="#0d151c" stroke-width="2"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"><path d="M152 128 C 142 140, 146 156, 156 164"/><path d="M180 128 C 190 140, 186 156, 176 164"/><path d="M162 132 L 162 158"/><path d="M170 132 L 170 158"/></g>
    <circle cx="122" cy="148" r="16" fill="#22303c" stroke="#0d151c" stroke-width="2"/>
    <circle cx="116" cy="146" r="7" fill="#3b4a57"/><circle cx="114" cy="144" r="2" fill="#ffffff" opacity="0.8"/>
    <path d="M108 156 L 42 198" stroke="#1b2733" stroke-width="4" stroke-linecap="round"/>
    <path d="M110 152 L 76 168" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <g fill="none" stroke="#1b2733" stroke-width="2.4" stroke-linecap="round"><path d="M112 138 C 96 122, 82 112, 64 106"/><path d="M116 136 C 106 116, 98 104, 86 92"/></g>
  </g></g>
  <text x="380" y="342" text-anchor="middle" class="t-titulo" font-size="16" fill="#0b4f5c">Ciclo de transmissão</text>
  <text x="380" y="364" text-anchor="middle" font-size="13" fill="#566577" font-style="italic">vírus da dengue (DENV)</text>
  <text x="380" y="384" text-anchor="middle" font-size="11.5" fill="#566577"><tspan x="380">vetor: fêmea do</tspan><tspan x="380" dy="14"><tspan font-style="italic">Aedes aegypti</tspan></tspan></text>

  <!-- 1 -->
  <g filter="url(#cd-sombra)"><rect x="268" y="18" width="224" height="96" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="292" cy="44" r="14" fill="#13858a"/><text x="292" y="49" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">1</text>
  <text x="314" y="49" class="t-titulo" font-size="13.5" fill="#0b4f5c">Picada no doente</text>
  <text x="284" y="74" font-size="11.5" fill="#1b2733"><tspan x="284">A fêmea pica uma pessoa com</tspan><tspan x="284" dy="16">o vírus no sangue (<tspan font-weight="700">viremia</tspan>:</tspan><tspan x="284" dy="16">de 1 dia antes da febre ao 6º dia).</tspan></text>

  <!-- 2 -->
  <g filter="url(#cd-sombra)"><rect x="524" y="196" width="224" height="112" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="548" cy="222" r="14" fill="#13858a"/><text x="548" y="227" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">2</text>
  <text x="570" y="227" class="t-titulo" font-size="13.5" fill="#0b4f5c">Dentro do mosquito</text>
  <text x="540" y="252" font-size="11.5" fill="#1b2733"><tspan x="540">O vírus se multiplica no</tspan><tspan x="540" dy="16">mosquito por <tspan font-weight="700">8 a 12 dias</tspan></tspan><tspan x="540" dy="16">(incubação <tspan font-style="italic">extrínseca</tspan>).</tspan><tspan x="540" dy="16">Depois, chega à saliva.</tspan></text>

  <!-- 3 -->
  <g filter="url(#cd-sombra)"><rect x="440" y="458" width="236" height="96" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="464" cy="484" r="14" fill="#13858a"/><text x="464" y="489" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">3</text>
  <text x="486" y="489" class="t-titulo" font-size="13.5" fill="#0b4f5c">Nova picada</text>
  <text x="456" y="514" font-size="11.5" fill="#1b2733"><tspan x="456">O mosquito infectado</tspan><tspan x="456" dy="16"><tspan font-weight="700">transmite pelo resto da vida</tspan></tspan><tspan x="456" dy="16">a cada vez que pica.</tspan></text>

  <!-- 4 -->
  <g filter="url(#cd-sombra)"><rect x="84" y="458" width="236" height="96" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="108" cy="484" r="14" fill="#13858a"/><text x="108" y="489" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">4</text>
  <text x="130" y="489" class="t-titulo" font-size="13.5" fill="#0b4f5c">Incubação na pessoa</text>
  <text x="100" y="514" font-size="11.5" fill="#1b2733"><tspan x="100">De <tspan font-weight="700">4 a 10 dias</tspan> (média de</tspan><tspan x="100" dy="16">5 a 6 dias): a incubação</tspan><tspan x="100" dy="16"><tspan font-style="italic">intrínseca</tspan>.</tspan></text>

  <!-- 5 -->
  <g filter="url(#cd-sombra)"><rect x="12" y="140" width="232" height="140" rx="14" fill="#fff" stroke="#b9dfdc" stroke-width="2"/></g>
  <circle cx="36" cy="166" r="14" fill="#13858a"/><text x="36" y="171" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">5</text>
  <text x="58" y="171" class="t-titulo" font-size="13.5" fill="#0b4f5c">Doença</text>
  <text x="28" y="196" font-size="11.5" fill="#1b2733"><tspan x="28">Surgem febre e os outros</tspan><tspan x="28" dy="16">sintomas. A pessoa com</tspan><tspan x="28" dy="16">viremia pode infectar novos</tspan><tspan x="28" dy="16">mosquitos — e o ciclo</tspan><tspan x="28" dy="16">recomeça.</tspan></text>
</svg>
