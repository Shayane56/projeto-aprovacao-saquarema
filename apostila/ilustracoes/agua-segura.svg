<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Como tratar a água em casa com hipoclorito de sódio a 2,5 por cento e cuidar da caixa-d'água">
  <defs>
    <linearGradient id="as-agua" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#cfeefa"/><stop offset="100%" stop-color="#7cc6e6"/></linearGradient>
    <linearGradient id="as-garrafa" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e9f4f7"/><stop offset="50%" stop-color="#ffffff"/><stop offset="100%" stop-color="#dcebef"/></linearGradient>
    <marker id="as-seta" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0a12f"/></marker>
    <filter id="as-sombra" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b4f5c" flood-opacity="0.14"/></filter>
  </defs>
  <rect x="8" y="8" width="744" height="324" rx="18" fill="#f2fafd" stroke="#bfe3f2" stroke-width="2"/>
  <text x="380" y="38" text-anchor="middle" class="t-titulo" font-size="16" fill="#0b4f5c">Água segura em 3 passos (hipoclorito de sódio a 2,5%)</text>

  <!-- passo 1 -->
  <g filter="url(#as-sombra)"><rect x="30" y="56" width="210" height="200" rx="14" fill="#fff"/></g>
  <circle cx="54" cy="80" r="14" fill="#2b8fc4"/><text x="54" y="85" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">1</text>
  <text x="76" y="85" class="t-titulo" font-size="13" fill="#0b4f5c">Pingar</text>
  <!-- jarra de 1 litro -->
  <path d="M84 132 L 150 132 L 146 236 L 88 236 Z" fill="url(#as-garrafa)" stroke="#9fb0b5" stroke-width="2.5"/>
  <path d="M86 156 L 148 156 L 146 236 L 88 236 Z" fill="url(#as-agua)"/>
  <text x="117" y="206" text-anchor="middle" class="t-titulo" font-size="14" fill="#0b4f5c">1 L</text>
  <!-- conta-gotas -->
  <g transform="translate(168 96) rotate(20)">
    <rect x="-6" y="0" width="12" height="40" rx="3" fill="#f0a12f"/>
    <path d="M-5 40 L 5 40 L 2 58 L -2 58 Z" fill="#e9f4f7" stroke="#9fb0b5"/>
  </g>
  <g fill="#f0a12f"><path d="M150 140 c 0 -6, 4 -10, 4 -10 c 0 0, 4 4, 4 10 a 4 4 0 0 1 -8 0 z"/><path d="M142 122 c 0 -6, 4 -10, 4 -10 c 0 0, 4 4, 4 10 a 4 4 0 0 1 -8 0 z"/></g>
  <text x="135" y="250" text-anchor="middle" font-size="11.5" fill="#1b2733"><tspan font-weight="700">2 gotas</tspan> por litro de água</text>

  <path d="M246 156 L 276 156" stroke="#f0a12f" stroke-width="4" marker-end="url(#as-seta)"/>

  <!-- passo 2 -->
  <g filter="url(#as-sombra)"><rect x="282" y="56" width="196" height="200" rx="14" fill="#fff"/></g>
  <circle cx="306" cy="80" r="14" fill="#2b8fc4"/><text x="306" y="85" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">2</text>
  <text x="328" y="85" class="t-titulo" font-size="13" fill="#0b4f5c">Esperar</text>
  <circle cx="380" cy="170" r="52" fill="#fff8ec" stroke="#f0a12f" stroke-width="4"/>
  <path d="M380 170 L 380 128 A 42 42 0 0 1 380 212 Z" fill="#ffd89a"/>
  <path d="M380 170 L 380 134" stroke="#0b4f5c" stroke-width="4" stroke-linecap="round"/>
  <path d="M380 170 L 404 170" stroke="#0b4f5c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="380" cy="170" r="5" fill="#0b4f5c"/>
  <text x="380" y="250" text-anchor="middle" font-size="11.5" fill="#1b2733"><tspan font-weight="700">30 minutos</tspan> antes de usar</text>

  <path d="M484 156 L 514 156" stroke="#f0a12f" stroke-width="4" marker-end="url(#as-seta)"/>

  <!-- passo 3 -->
  <g filter="url(#as-sombra)"><rect x="520" y="56" width="210" height="200" rx="14" fill="#fff"/></g>
  <circle cx="544" cy="80" r="14" fill="#2a9a68"/><text x="544" y="85" text-anchor="middle" fill="#fff" class="t-titulo" font-size="14">3</text>
  <text x="566" y="85" class="t-titulo" font-size="13" fill="#0b4f5c">Pronta</text>
  <path d="M594 128 L 656 128 L 648 232 L 602 232 Z" fill="url(#as-garrafa)" stroke="#9fb0b5" stroke-width="2.5"/>
  <path d="M597 150 L 653 150 L 648 232 L 602 232 Z" fill="url(#as-agua)"/>
  <circle cx="676" cy="140" r="16" fill="#2a9a68"/><path d="M668 140 l 6 6 l 10 -12" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="625" y="250" text-anchor="middle" font-size="11.5" fill="#1b2733">para <tspan font-weight="700">beber e cozinhar</tspan></text>

  <!-- faixa da caixa-d'água -->
  <g transform="translate(30 270)">
    <rect x="0" y="0" width="700" height="50" rx="12" fill="#0b4f5c"/>
    <path d="M24 14 L 60 14 L 58 40 L 26 40 Z" fill="#9fd8ef"/><rect x="20" y="9" width="44" height="7" rx="3" fill="#ffd38a"/>
    <text font-size="12" fill="#ffffff"><tspan x="80" y="22" font-weight="700" fill="#ffd38a">Caixa-d’água:</tspan><tspan x="80" dy="16">sempre bem tampada e lavada e desinfetada a cada 6 meses.</tspan></text>
    <text x="684" y="30" text-anchor="end" font-size="11" fill="#bfe3f2">Na falta de hipoclorito: filtrar e ferver.</text>
  </g>
</svg>
