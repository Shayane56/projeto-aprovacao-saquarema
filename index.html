<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1D4ED8" />
    <meta name="description" content="Preparação para o Processo Seletivo de Agente de Combate às Endemias — Saquarema/RJ." />
    <title>Projeto Aprovação Saquarema</title>
    <script>
      // Aplica o tema antes do primeiro desenho, evitando "piscar" claro→escuro.
      (function () {
        try {
          var t = localStorage.getItem('pas:tema') || 'sistema';
          var escuro = t === 'escuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', escuro);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
