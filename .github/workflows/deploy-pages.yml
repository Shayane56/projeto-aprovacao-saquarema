name: Publicar (banco + app)

# A cada atualização da branch main:
#  1. aplica no Supabase as migrações novas de supabase/migrations (se os segredos estiverem configurados);
#  2. publica o app no GitHub Pages.
# Segredos necessários (Settings → Secrets and variables → Actions):
#  SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD — veja docs/CONFIGURACAO.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  banco:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJETO: azydkohkesfcbaynzktx
    steps:
      - uses: actions/checkout@v4
      - name: Verificar segredos
        id: segredos
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Segredos do Supabase não configurados — migrações não aplicadas (veja docs/CONFIGURACAO.md)."
          fi
      - uses: supabase/setup-cli@v1
        if: steps.segredos.outputs.ok == 'true'
        with:
          version: 2.122.1
      - name: Aplicar migrações no Supabase
        if: steps.segredos.outputs.ok == 'true'
        run: |
          supabase link --project-ref "$PROJETO" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --include-all --password "$SUPABASE_DB_PASSWORD" --yes

  build:
    needs: banco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
