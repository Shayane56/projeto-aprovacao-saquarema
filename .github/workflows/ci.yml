name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migração do edital sincronizada com o JSON
        run: npm run seed:gerar && git diff --exit-code supabase/
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
